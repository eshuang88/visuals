#define LOOP 30.0

// large, slow "weather" field — decides where the light pools this pass.
// its single circular offset keeps it periodic over the loop.
float weather(vec2 p, float ph){
  vec2 c = 0.5 * vec2(cos(ph), sin(ph));
  return fbm(p * 0.7 + c + vec2(3.3, 1.1));
}

// iterative domain warp -> a few big sweeping metal folds (low freq = big folds).
// all flow enters via circular (looping) offsets c1/c2/c3 at 1x/2x/3x the loop
// frequency, so heightField is exactly periodic in ph.
float heightField(vec2 p, float ph, float bass){
  vec2 c1 = vec2(cos(ph),           sin(ph));
  vec2 c2 = vec2(cos(2.0*ph + 1.3), sin(2.0*ph + 0.7));
  vec2 c3 = vec2(cos(3.0*ph - 0.5), sin(3.0*ph + 2.1));
  float warp = 1.65 + bass * 1.05;                 // fold depth breathes with the bass
  vec2 w1 = vec2(fbm(p + 0.55*c1),
                 fbm(p + 0.55*c1 + vec2(5.2, 1.3)));
  vec2 w2 = vec2(fbm(p + 2.6*w1 + 0.42*c2 + vec2(1.7, 9.2)),
                 fbm(p + 2.6*w1 + 0.42*c2 + vec2(8.3, 2.8)));
  return fbm(p + warp*w2 + 0.30*c3);
}

// faux chrome environment (what the metal reflects). mood (0..1) slowly shifts
// the whole reflection between a colder steel-cream and a deeper indigo, staying
// in the deep-blue family: near-black floor, hot cream horizon band drifting a
// touch toward ice, cold-white key highlight.
vec3 env(vec3 rd, float mood){
  float y = rd.y;
  vec3 lower = mix(vec3(0.002, 0.006, 0.020),   // near-black indigo floor
                   vec3(0.004, 0.010, 0.030), mood);
  vec3 upper = mix(vec3(0.020, 0.050, 0.120),   // deep blue sky
                   vec3(0.028, 0.060, 0.165), mood);
  vec3 col = mix(lower, upper, smoothstep(-0.35, 0.7, y));
  vec3 band = mix(IL_WARMWHITE, mix(IL_WARMWHITE, IL_ICE, 0.32), mood);
  col += band * exp(-abs(y - 0.015) * 10.0) * 1.7;                    // hot horizon light band
  col += mix(vec3(0.55, 0.62, 0.72), vec3(0.47, 0.60, 0.80), mood)
         * exp(-abs(y + 0.12) * 4.0) * 0.35;                          // soft bounce
  float key = pow(max(dot(rd, normalize(vec3(-0.42, 0.34, 0.62))), 0.0), 40.0);
  col += mix(vec3(0.85, 0.93, 1.10), vec3(0.80, 0.90, 1.18), mood) * key * 1.5; // cold-white key
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;   // y in [-.5,.5], x aspect-correct
  float bass = u_bass;

  // ---- the 30s loop phase (seamless + perfectly periodic) ----
  float ph    = TAU * u_time / LOOP;
  float mood  = 0.5 + 0.5 * sin(ph);            // slow 30s temperature breathe
  float mood2 = 0.5 + 0.5 * sin(2.0*ph + 1.0);  // 15s secondary drift

  // ---- flicker family (a "flicker is an instrument" per CLAUDE.md) ----
  // every term is a high integer harmonic of ph, so each repeats at 30s (loop
  // stays exact) but their sum is irregular / non-metronomic — a flutter, not a
  // strobe. u_bass adds live reactivity: in the 115 BPM fallback it pulses on the
  // beat, so the shimmer rides the tempo when there's no mic.
  float ef      = sin(ph*7.0 + 1.3) + 0.7*sin(ph*11.0 + 2.1) + 0.5*sin(ph*17.0);
  float specShim = 0.78 + 0.22 * sin(ph*19.0);  // fast highlight shiver base

  vec2  p = uv * 0.98;
  float e = 0.02;
  float hC = heightField(p,                 ph, bass);
  float hL = heightField(p + vec2(-e, 0.0), ph, bass);
  float hR = heightField(p + vec2( e, 0.0), ph, bass);
  float hD = heightField(p + vec2(0.0,-e),  ph, bass);
  float hU = heightField(p + vec2(0.0, e),  ph, bass);

  float relief = 0.60 + bass * 0.38;                   // fold steepness breathes with the bass
  vec2  grad   = vec2(hR - hL, hU - hD) / (2.0 * e);
  vec3  N      = normalize(vec3(-grad * relief, 1.0));

  vec3 V = normalize(vec3(0.0, 0.32, 1.0));            // camera looks slightly down the folds
  vec3 L = normalize(vec3(-0.38, 0.46, 0.55));         // cold white key light
  vec3 H = normalize(L + V);

  vec3  R    = reflect(-V, N);
  vec3  refl = env(R, mood);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 2.8);

  // large low-freq "weather" tints the body per-region and moves each pass, so
  // different folds take slightly different blues -> more colour variation.
  float tf = weather(p * 1.3 + 7.0, ph);
  vec3 bodyHi = mix(vec3(0.30, 0.44, 0.62),     // steel blue
                    vec3(0.24, 0.42, 0.68), tf); // deeper indigo
  vec3 body = mix(vec3(0.006, 0.018, 0.05), bodyHi, hC);   // creamy-blue base
  vec3 col  = mix(body, refl, 0.58 + 0.42*fres);

  float ndh = max(dot(N, H), 0.0);
  // blown cream specular, now shivering: per-location phase (hC) desyncs the
  // shiver across highlights so they twinkle out of step rather than as a block.
  col += vec3(1.0, 0.97, 0.86) * pow(ndh, 42.0) * 1.7 * (specShim + 0.18*sin(ph*23.0 + hC*28.0));
  col += vec3(0.88, 0.92, 0.97) * pow(ndh, 7.0) * 0.55; // creamy satin sheen
  col += vec3(0.08, 0.15, 0.28) * max(dot(N, L), 0.0) * 0.25; // cold diffuse fill

  // active chrome twinkle: glints wink on/off on the crests (texture flicker).
  // two noise fields drift at high harmonics of the loop, so the sparkle pattern
  // churns quickly; bass makes it flare, so it pulses on the 115 BPM fallback.
  float tw1 = vnoise(p * 6.5  + vec2(cos(7.0*ph)*2.0, sin(5.0*ph)*2.0) + 11.0);
  float tw2 = vnoise(p * 11.0 + vec2(sin(9.0*ph)*2.5, cos(6.0*ph)*2.5) + 4.0);
  float crest = smoothstep(0.52, 0.92, hC);
  float glint = smoothstep(0.66, 0.98, tw1) * smoothstep(0.60, 0.97, tw2);
  col += vec3(0.86, 0.92, 1.0) * glint * crest * (0.26 + 0.60*bass) * (0.9 + 0.3*mood2);

  // luminous cream haze — its pool follows the weather field, so where the light
  // gathers wanders across the loop instead of always hugging the top edge.
  float hazeY = smoothstep(-0.1, 0.5, uv.y);
  float pool  = mix(0.75, 1.25, tf);
  col += vec3(0.85, 0.88, 0.82) * hazeY * hazeY * 0.14 * pool * (0.6 + 0.6*fres);
  col = mix(col, vec3(0.01, 0.03, 0.07), smoothstep(0.28, 0.5, uv.y) * 0.55); // near-black top

  // non-metronomic way (a few percent), with an extra kick from the bass.
  col *= 1.0 + 0.045*ef + 0.10*bass;

  float sweepX  = sin(ph*2.0) * 0.75;
  float leak    = exp(-pow((uv.x - sweepX) / 0.20, 2.0));
  float leakAmt = smoothstep(0.55, 1.0, sin(ph*3.0 + 0.7));
  col += IL_WARMWHITE * leak * leakAmt * 0.09 * (0.7 + 0.8*bass);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}`

vec3 wallCol(vec2 uv, float leftSide){
  float m = fbm(uv*3.0 + 5.0);
  vec3 base = vec3(0.235, 0.262, 0.250) * (0.86 + 0.24*m);
  float pan = 0.0;
  if(leftSide > 0.5){
    pan += rectBorder(uv, vec2(0.030, 0.30), vec2(0.205, 0.855), 0.010);
    pan += rectBorder(uv, vec2(0.050, 0.055), vec2(0.190, 0.260), 0.010);
  } else {
    pan += rectBorder(uv, vec2(0.795, 0.30), vec2(0.970, 0.855), 0.010);
    pan += rectBorder(uv, vec2(0.810, 0.055), vec2(0.950, 0.260), 0.010);
  }
  base += pan * 0.045;                                   // etch lines catch light
  base *= 1.0 + 0.050*flick(leftSide > 0.5 ? 11.0 : 21.0);
  return base;
}

// interior floor: cool grey + faint tile joints + flicker.
vec3 floorCol(vec2 uv){
  float m = fbm(uv*4.0 + 9.0);
  vec3 base = vec3(0.285, 0.305, 0.298) * (0.90 + 0.16*m);
  vec2 g = fract(vec2(uv.x*7.0, (uv.y + 0.02)*11.0));
  float j = smoothstep(0.035, 0.0, min(g.x, 1.0-g.x))
          + smoothstep(0.050, 0.0, min(g.y, 1.0-g.y));
  base -= j * 0.035;
  base *= 1.0 + 0.045*flick(31.0);
  return base;
}

// the view through the doorway: pale sill -> grass -> thin sea+halation -> sky.
// each band carries its own flick(); w is the (breathing) soft-edge width.
vec3 viewCol(vec2 uv, float w){
  float y = uv.y;

  // sky: vertical gradient (hazier at the horizon) + slow drifting cloud.
  vec2  sc    = 0.5 * vec2(cos(PH), sin(PH));           // circular -> loops
  float cloud = fbm(vec2(uv.x*2.6, y*2.6) + sc + 10.0);
  vec3  sky   = mix(vec3(0.60,0.71,0.75), vec3(0.37,0.52,0.64),
                    smoothstep(0.50, 0.86, y));
  sky = mix(sky, sky*1.07 + 0.02, cloud*0.55);
  sky *= 1.0 + 0.045*flick(1.0);

  // ocean line (thin, dark, desaturated blue).
  vec3 ocean = vec3(0.19, 0.32, 0.40) * (1.0 + 0.050*flick(2.0));

  // grass: blade fbm + darker bush clumps, gentle wind pan (loops via sin(PH)).
  vec2  gc    = vec2(sin(PH*2.0)*0.25, cos(PH*1.5)*0.15);
  float blade = fbm(vec2(uv.x*7.0, y*11.0) + gc + 3.0);
  float bush  = fbm(vec2(uv.x*3.5 + sin(PH)*0.20, y*3.5) + 21.0);
  vec3  grass = mix(vec3(0.40,0.52,0.28), vec3(0.29,0.43,0.22), blade);
  grass = mix(grass, vec3(0.19,0.29,0.16), smoothstep(0.55, 0.82, bush));
  grass *= 1.0 + 0.050*flick(3.0);

  // pale concrete sill in front of the lawn.
  vec3 sill = vec3(0.62, 0.64, 0.60) * (1.0 + 0.040*flick(4.0));

  // stack bottom -> top with soft, focus-breathing edges.
  vec3 v = sill;
  v = mix(v, grass, smoothstep(0.250-w, 0.250+w, y));
  v = mix(v, ocean, smoothstep(0.485-w, 0.485+w, y));
  v = mix(v, sky,   smoothstep(0.515-w, 0.515+w, y));

  // halation: a hot warm-white pool on the horizon, breathing with the bass.
  float glow = exp(-pow((y - 0.508)/0.028, 2.0));
  v += vec3(0.92,0.90,0.84) * glow * (0.30 + 0.35*BASS) * (0.80 + 0.35*flick(5.0));
  return v;
}

// dark plant silhouette in the corner: a vase mass + a few swaying branches.
float plantMask(vec2 uv){
  vec2  vp   = (uv - vec2(0.885, 0.10)) / vec2(0.085, 0.085);
  float vase = smoothstep(1.02, 0.86, length(vp));
  float br = 0.0;
  for(int i = 0; i < 4; i++){
    float fi   = float(i);
    float x0   = 0.905 - fi*0.006;
    float lean = (fi - 1.5) * 0.045;
    float t    = clamp((uv.y - 0.16)/0.52, 0.0, 1.0);
    float x    = x0 + lean*t + 0.012*sin(PH + fi*1.7 + t*3.0)*t;   // gentle sway
    float d    = abs(uv.x - x);
    br = max(br, step(0.16, uv.y) * smoothstep(0.0045, 0.0, d)
                                  * smoothstep(1.0, 0.78, t));      // taper at top
  }
  return clamp(vase + br, 0.0, 1.0);
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  PH   = TAU * u_time / LOOP;
  BASS = u_bass;

  // focus drift (Moonvoid): every soft edge widens and re-sharpens over the loop.
  float w = 0.006 + 0.010 * (0.5 + 0.5*sin(PH));

  // aperture geometry (the doorway opening).
  float apXL = 0.245, apXR = 0.755, floorY = 0.165, beamY = 0.860;
  float apX = smoothstep(apXL-w, apXL+w, uv.x) * smoothstep(apXR+w, apXR-w, uv.x);
  float apY = smoothstep(floorY-w, floorY+w, uv.y) * smoothstep(beamY+w, beamY-w, uv.y);
  float ap  = apX * apY;

  // frame: side walls everywhere, then floor over the bottom, beam over the top.
  vec3 col  = wallCol(uv, uv.x < 0.5 ? 1.0 : 0.0);
  vec3 beam = vec3(0.135, 0.152, 0.150) * (0.90 + 0.15*fbm(uv*3.0 + 2.0));
  beam *= 1.0 + 0.045*flick(41.0);
  col = mix(col, floorCol(uv), smoothstep(floorY+w, floorY-w, uv.y));
  col = mix(col, beam,          smoothstep(beamY-w,  beamY+w,  uv.y));

  // the view fills the aperture.
  col = mix(col, viewCol(uv, w), ap);

  // dark plant over the corner (near-black, faintly cool).
  float pm = plantMask(uv);
  col = mix(col, IL_BLACK*1.4 + vec3(0.0, 0.005, 0.010), pm);

  // --- whole-frame flicker family (never metronomic) ---
  // irregular exposure flutter + a rare warm light-leak sweeping the aperture.
  float ef = sin(PH*7.0 + 1.3) + 0.7*sin(PH*11.0 + 2.1) + 0.5*sin(PH*17.0);
  col *= 1.0 + 0.030*ef + 0.080*BASS;
  float sweepX  = 0.5 + 0.42*sin(PH*2.0);
  float leak    = exp(-pow((uv.x - sweepX)/0.16, 2.0));
  float leakAmt = smoothstep(0.60, 1.0, sin(PH*3.0 + 0.7));
  col += IL_WARMWHITE * leak * leakAmt * 0.060 * (0.70 + 0.70*BASS) * ap;

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, BASS), 1.0);
}`
  },
  {
    title: "ENDING", bpm: 115,
    scene: `/* Cover slide — show a still image (u_tex) CONTAIN-fit inside the 4:3 frame,
   letterboxed on black (the cover art's own black field merges with the bars, so
   it reads full-bleed). Kept faithful to the artwork: only a whisper of animated
   grain and a few-percent bass lift so it breathes with the room instead of
   looking frozen. Used by setlist { cover: '…' } entries. */
void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  float ia = u_texRes.x / max(u_texRes.y, 1.0);   // image aspect
  float sa = u_res.x    / max(u_res.y, 1.0);       // stage aspect (4:3)

  // contain: fit the whole image, expanding the sample coord past [0,1] in the
  // letterbox direction so those pixels fall outside the image -> black.
  vec2 t = uv - 0.5;
  if (ia > sa) t.y *= ia / sa;   // image wider than 4:3 -> bars top/bottom
  else         t.x *= sa / ia;   // image taller/square -> bars left/right
  t += 0.5;

  vec3 col = vec3(0.0);
  if (t.x > 0.0 && t.x < 1.0 && t.y > 0.0 && t.y < 1.0)
    col = texture2D(u_tex, t).rgb;

  col *= 1.0 + 0.04 * u_bass;                       // subtle life with the room
  float g = hash(gl_FragCoord.xy + fract(u_time) * vec2(91.7, 47.3));
  col += (g - 0.5) * 0.02;                          // whisper of grain (not frozen)

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`,
    image: window.ILCOVER01
  }
