#define LOOP 30.0

// large, slow "weather" field — decides where the light pools this pass.
// its single circular offset keeps it periodic over the loop.
float weather(vec2 p, float ph){
  vec2 c = 0.5 * vec2(cos(ph), sin(ph));
  return fbm(p * 0.7 + c + vec2(3.3, 1.1));
}

// iterative domain warp -> a few big sweeping metal folds (low freq = big folds).
// all flow enters via circular (looping) offsets c1/c2/c3 at 1x/2x/3x the loop
// frequency, so heightField is exactly periodic in ph.
float heightField(vec2 p, float ph, float bass){
  vec2 c1 = vec2(cos(ph),           sin(ph));
  vec2 c2 = vec2(cos(2.0*ph + 1.3), sin(2.0*ph + 0.7));
  vec2 c3 = vec2(cos(3.0*ph - 0.5), sin(3.0*ph + 2.1));
  float warp = 1.65 + bass * 1.05;                 // fold depth breathes with the bass
  vec2 w1 = vec2(fbm(p + 0.55*c1),
                 fbm(p + 0.55*c1 + vec2(5.2, 1.3)));
  vec2 w2 = vec2(fbm(p + 2.6*w1 + 0.42*c2 + vec2(1.7, 9.2)),
                 fbm(p + 2.6*w1 + 0.42*c2 + vec2(8.3, 2.8)));
  return fbm(p + warp*w2 + 0.30*c3);
}

// faux chrome environment (what the metal reflects). mood (0..1) slowly shifts
// the whole reflection between a colder steel-cream and a deeper indigo, staying
// in the deep-blue family: near-black floor, hot cream horizon band drifting a
// touch toward ice, cold-white key highlight.
vec3 env(vec3 rd, float mood){
  float y = rd.y;
  vec3 lower = mix(vec3(0.002, 0.006, 0.020),   // near-black indigo floor
                   vec3(0.004, 0.010, 0.030), mood);
  vec3 upper = mix(vec3(0.020, 0.050, 0.120),   // deep blue sky
                   vec3(0.028, 0.060, 0.165), mood);
  vec3 col = mix(lower, upper, smoothstep(-0.35, 0.7, y));
  vec3 band = mix(IL_WARMWHITE, mix(IL_WARMWHITE, IL_ICE, 0.32), mood);
  col += band * exp(-abs(y - 0.015) * 10.0) * 1.7;                    // hot horizon light band
  col += mix(vec3(0.55, 0.62, 0.72), vec3(0.47, 0.60, 0.80), mood)
         * exp(-abs(y + 0.12) * 4.0) * 0.35;                          // soft bounce
  float key = pow(max(dot(rd, normalize(vec3(-0.42, 0.34, 0.62))), 0.0), 40.0);
  col += mix(vec3(0.85, 0.93, 1.10), vec3(0.80, 0.90, 1.18), mood) * key * 1.5; // cold-white key
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;   // y in [-.5,.5], x aspect-correct
  float bass = u_bass;

  // ---- the 30s loop phase (seamless + perfectly periodic) ----
  float ph    = TAU * u_time / LOOP;
  float mood  = 0.5 + 0.5 * sin(ph);            // slow 30s temperature breathe
  float mood2 = 0.5 + 0.5 * sin(2.0*ph + 1.0);  // 15s secondary drift

  // ---- flicker family (a "flicker is an instrument" per CLAUDE.md) ----
  // every term is a high integer harmonic of ph, so each repeats at 30s (loop
  // stays exact) but their sum is irregular / non-metronomic — a flutter, not a
  // strobe. u_bass adds live reactivity: in the 115 BPM fallback it pulses on the
  // beat, so the shimmer rides the tempo when there's no mic.
  float ef      = sin(ph*7.0 + 1.3) + 0.7*sin(ph*11.0 + 2.1) + 0.5*sin(ph*17.0);
  float specShim = 0.78 + 0.22 * sin(ph*19.0);  // fast highlight shiver base

  vec2  p = uv * 0.98;
  float e = 0.02;
  float hC = heightField(p,                 ph, bass);
  float hL = heightField(p + vec2(-e, 0.0), ph, bass);
  float hR = heightField(p + vec2( e, 0.0), ph, bass);
  float hD = heightField(p + vec2(0.0,-e),  ph, bass);
  float hU = heightField(p + vec2(0.0, e),  ph, bass);

  float relief = 0.60 + bass * 0.38;                   // fold steepness breathes with the bass
  vec2  grad   = vec2(hR - hL, hU - hD) / (2.0 * e);
  vec3  N      = normalize(vec3(-grad * relief, 1.0));

  vec3 V = normalize(vec3(0.0, 0.32, 1.0));            // camera looks slightly down the folds
  vec3 L = normalize(vec3(-0.38, 0.46, 0.55));         // cold white key light
  vec3 H = normalize(L + V);

  vec3  R    = reflect(-V, N);
  vec3  refl = env(R, mood);
  float fres = pow(1.0 - max(dot(N, V), 0.0), 2.8);

  // large low-freq "weather" tints the body per-region and moves each pass, so
  // different folds take slightly different blues -> more colour variation.
  float tf = weather(p * 1.3 + 7.0, ph);
  vec3 bodyHi = mix(vec3(0.30, 0.44, 0.62),     // steel blue
                    vec3(0.24, 0.42, 0.68), tf); // deeper indigo
  vec3 body = mix(vec3(0.006, 0.018, 0.05), bodyHi, hC);   // creamy-blue base
  vec3 col  = mix(body, refl, 0.58 + 0.42*fres);

  float ndh = max(dot(N, H), 0.0);
  // blown cream specular, now shivering: per-location phase (hC) desyncs the
  // shiver across highlights so they twinkle out of step rather than as a block.
  col += vec3(1.0, 0.97, 0.86) * pow(ndh, 42.0) * 1.7 * (specShim + 0.18*sin(ph*23.0 + hC*28.0));
  col += vec3(0.88, 0.92, 0.97) * pow(ndh, 7.0) * 0.55; // creamy satin sheen
  col += vec3(0.08, 0.15, 0.28) * max(dot(N, L), 0.0) * 0.25; // cold diffuse fill

  // active chrome twinkle: glints wink on/off on the crests (texture flicker).
  // two noise fields drift at high harmonics of the loop, so the sparkle pattern
  // churns quickly; bass makes it flare, so it pulses on the 115 BPM fallback.
  float tw1 = vnoise(p * 6.5  + vec2(cos(7.0*ph)*2.0, sin(5.0*ph)*2.0) + 11.0);
  float tw2 = vnoise(p * 11.0 + vec2(sin(9.0*ph)*2.5, cos(6.0*ph)*2.5) + 4.0);
  float crest = smoothstep(0.52, 0.92, hC);
  float glint = smoothstep(0.66, 0.98, tw1) * smoothstep(0.60, 0.97, tw2);
  col += vec3(0.86, 0.92, 1.0) * glint * crest * (0.26 + 0.60*bass) * (0.9 + 0.3*mood2);

  // luminous cream haze — its pool follows the weather field, so where the light
  // gathers wanders across the loop instead of always hugging the top edge.
  float hazeY = smoothstep(-0.1, 0.5, uv.y);
  float pool  = mix(0.75, 1.25, tf);
  col += vec3(0.85, 0.88, 0.82) * hazeY * hazeY * 0.14 * pool * (0.6 + 0.6*fres);
  col = mix(col, vec3(0.01, 0.03, 0.07), smoothstep(0.28, 0.5, uv.y) * 0.55); // near-black top

  // exposure flutter — the whole frame breathes brighter/darker in an irregular,
  // non-metronomic way (a few percent), with an extra kick from the bass.
  col *= 1.0 + 0.045*ef + 0.10*bass;

  // rare light-leak: a soft cream bar drifts across and only sometimes brightens,
  // like a stray reflection sweeping the metal. loop-periodic + gated (occasional).
  float sweepX  = sin(ph*2.0) * 0.75;
  float leak    = exp(-pow((uv.x - sweepX) / 0.20, 2.0));
  float leakAmt = smoothstep(0.55, 1.0, sin(ph*3.0 + 0.7));
  col += IL_WARMWHITE * leak * leakAmt * 0.09 * (0.7 + 0.8*bass);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}`

  w += 0.018*(abs(fract(y*6.0 + 0.3*sin(ph)) - 0.5) - 0.25); // angular sawtooth notches
  return max(0.006, w);
}

// twinkling glitter: cellular stars that blink on loop-periodic phases.
float glitterLayer(vec2 p, float ph, float seed){
  vec2 g = floor(p), f = fract(p);
  float r  = hash(g + seed);
  if (r < 0.55) return 0.0;                              // only some cells hold a star
  vec2  star = vec2(hash(g + seed + 2.3), hash(g + seed + 5.7));
  float d    = length(f - star);
  float k    = 3.0 + floor(hash(g + seed + 9.1) * 9.0);  // integer harmonic -> loops
  float blink= 0.5 + 0.5*sin(ph*k + hash(g + seed + 4.4)*TAU);
  return smoothstep(0.10, 0.0, d) * pow(blink, 7.0);
}

// ---- structural field: concrete monoliths + secret-sky crack + raking light.
// Evaluated three times (R/G/B) for the chroma split, so keep it self-contained.
vec3 field(vec2 p, float ph, float bass, out float edge){
  float cx = crackCenter(p.y, ph);
  float ch = crackHalf(p.y, ph);
  float dx = abs(p.x - cx);

  float aa   = 0.004;
  float sky  = smoothstep(ch + aa, ch - aa, dx);        // 1 inside the crack
  edge = smoothstep(ch + 0.05, ch, dx) * (1.0 - sky);   // bright rim just outside

  // ---- secret sky in the slot: ice -> warm white, drifting clouds ----
  float sy    = clamp((p.y + 0.5), 0.0, 1.0);
  float cloud = flowFbm(vec2(p.x*2.4 + 4.0, p.y*3.2 - sy*1.5), ph*0.6);
  vec3  skyc  = mix(IL_ICE*0.92, IL_WARMWHITE, smoothstep(0.30, 0.9, cloud));  // keep some ice/cloud
  skyc = mix(skyc, IL_WARMWHITE*1.05, smoothstep(0.25, 0.8, sy)*0.35);  // brighter up high
  skyc *= 0.95 + 0.35*bass;                                            // slot breathes with the low end

  // ---- concrete faces (everything outside the crack) ----
  float side  = sign(p.x - cx);                          // -1 left wall, +1 right wall
  // raw board-formed tone: graphite-blue, mottled, faint violet in the shadow
  float mott  = fbm(p*5.5 + 13.0)*0.6 + fbm(p*17.0 + 2.0)*0.4;
  vec3  conc  = mix(IL_GRAPHITE, IL_BLUE, 0.35 + 0.3*mott);
  conc  = mix(conc, IL_VIOLET, 0.10);
  conc *= 0.42 + 0.34*mott;                              // dark, moody, flatter concrete body
  // horizontal formwork board lines (subtle)
  float board = smoothstep(0.06, 0.16, abs(fract(p.y*11.0) - 0.5));
  conc *= 0.88 + 0.12*board;
  // diagonal diamond panel seams (the signature X of the photo) — darker grooves
  float d1 = abs(fract((p.x + p.y)*2.3) - 0.5);
  float d2 = abs(fract((p.x - p.y)*2.3) - 0.5);
  float seam = smoothstep(0.0, 0.05, d1) * smoothstep(0.0, 0.05, d2);
  conc *= 0.72 + 0.28*seam;                              // grooves, not tufting
  // form-tie holes: dark dots on a diagonal grid, tiny lit lip
  vec2  hg = vec2(p.x + p.y, p.x - p.y) * 2.3;
  vec2  hf = fract(hg) - 0.5;
  float hole = smoothstep(0.11, 0.05, length(hf));
  conc *= 1.0 - 0.7*hole;
  conc += IL_WARMWHITE * 0.05 * smoothstep(0.16, 0.11, length(hf)) * smoothstep(0.05, 0.11, length(hf));

  // raking daylight brushed diagonally down each wall (slow drift, loop-periodic)
  float diag  = p.y*1.6 - side*p.x*1.1;
  float rake  = flowFbm(vec2(diag*2.0, p.y*1.2), ph*0.8);
  float streak= smoothstep(0.45, 0.95, rake);
  conc += mix(IL_ICE, IL_WARMWHITE, 0.6) * streak * (0.22 + 0.10*bass) * (0.6 + 0.5*mott);
  // ambient bounce from the bright slot onto the inner faces
  conc += IL_WARMWHITE * 0.35 * edge * (0.5 + 0.5*bass);

  vec3 col = mix(conc, skyc, sky);
  // crack rim bloom
  col += IL_WARMWHITE * edge * (0.35 + 0.6*bass);

  // ---- glitter: twinkles densest at the crack edges + along the streaks ----
  float gmask = clamp(edge*2.0 + streak*0.5 + sky*0.25, 0.0, 1.5);
  float glit  = glitterLayer(p*26.0, ph, 0.0)
              + glitterLayer(p*44.0 + 7.0, ph*1.37, 3.0)*0.7;
  col += mix(IL_ICE, IL_WARMWHITE, 0.5) * glit * gmask * (1.0 + 1.8*bass);

  return col;
}

void main(){
  vec2  R  = u_res;
  vec2  fc = gl_FragCoord.xy;
  vec2  p  = (fc - 0.5*R) / R.y;          // aspect-correct, y up, centred
  float bass = u_bass;
  float ph = TAU * u_time / LOOP;         // seamless 30 s loop phase

  // ---- flicker family (loop-exact high harmonics, non-metronomic) ----
  float ef    = 0.05*sin(ph*7.0 + 1.1) + 0.035*sin(ph*13.0 + 2.4) + 0.025*sin(ph*19.0);
  // rare 2-4 "frame" deconstruction surge — a couple of times per loop
  float surge = smoothstep(0.88, 1.0, 0.5+0.5*sin(ph*3.0)) *
                smoothstep(0.90, 1.0, 0.5+0.5*sin(ph*11.0 + 2.0));
  float shear = surge + 0.35*bass*surge;

  // deconstruction: shear the walls into cool horizontal blocks on a surge/bass
  float band = floor(p.y*10.0 + ph);
  float jit  = (hash(vec2(band, floor(ph*2.0))) - 0.5);
  p.x += jit * (0.010*bass + 0.06*shear) * step(0.45, hash(vec2(band, 3.7)));

  // ---- CHROMA (RGB) split: radial fringe, wider with the music + at surges ----
  vec2  rad = p;                          // from centre
  float ca  = 0.0032 + 0.007*bass + 0.02*surge;
  float e0, e1, e2;
  vec3  col;
  col.r = field(p + rad*ca, ph, bass, e0).r;
  col.g = field(p,          ph, bass, e1).g;
  col.b = field(p - rad*ca, ph, bass, e2).b;

  // ---- retro grade: exposure breathe, VHS scanline, whole-frame bloom ----
  col *= 1.0 + ef + 0.10*bass;
  float scan = 0.96 + 0.04*sin(fc.y*2.2 + u_time*1.5);     // faint analog scanline
  col *= scan;
  col += IL_WARMWHITE * surge * 0.10;                      // memory bloom on the deconstruction

  // tone-map the bright slot / glitter into [0,1) before the house S-grade
  // (ambientPost's S-contrast only behaves for col<1).
  col = vec3(1.0) - exp(-col * 1.25);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}`

vec3 goldRamp(float h){

  vec3 c1 = vec3(0.300, 0.170, 0.050);
  vec3 c2 = vec3(0.620, 0.400, 0.120);

  col = mix(col, c2, smoothstep(0.30, 0.60, h));
  col = mix(col, c3, smoothstep(0.55, 0.80, h));
  col = mix(col, c4, smoothstep(0.78, 1.00, h));

}
float heat(vec2 p, float ph, float bass){
  vec2 c1 = 0.55 * vec2(cos(ph),           sin(ph));
  vec2 c2 = 0.42 * vec2(cos(ph*0.73 + 1.7), sin(ph*0.73 + 1.7));
  float w1 = fbm(p + c1);

  vec2  p3 = p2 + 1.0 * vec2(w2, fbm(p2 + c2 + 6.2));
  float h  = fbm(p3);
  h = clamp(h * 1.18 - 0.05 + bass * 0.22, 0.0, 1.0);
  return mix(h, smoothstep(0.05, 0.95, h), 0.35);
}

  float hU = heat(p + vec2(0.0, e),  ph, bass);
  float hD = heat(p - vec2(0.0, e),  ph, bass);
  float relief = 0.55 + bass * 0.40;

  float chrome = pow(0.5 + 0.5*sin(ang*3.0 + hC*10.0 + ph*0.3), 1.5);
  vec3  cream  = vec3(0.97, 0.92, 0.80);
  col = mix(col, col * cream * (0.55 + 0.9*chrome), 0.30 * smoothstep(0.30, 0.80, hC));

  // warm cream specular sheen — a non-metronomic flicker instrument. Kept warm
  // and gentle (no cold blue) to hold the low-saturation house rule.
  float sheen = smoothstep(0.0, 0.16, length(grad) * 0.5);
  float flick = 0.25 + 0.55 * (0.5 + 0.5*sin(ph*3.1) + 0.25*sin(ph*5.3)) * (0.5 + 0.5*bass);

  col *= 1.0 + 0.045*ef + 0.10*bass;

  // cold S-grade in ambientPost can't invert blown warm highlights toward blue.
  col /= 1.0 + 0.35 * max(max(col.r, col.g), col.b);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}`
