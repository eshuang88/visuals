<!-- ========================================================================
  07 · PAUL SECRET SKY  (IL_paulSecretSky)

  A generative reinterpretation of Paul's concrete-canyon photo: two raw
  board-formed monoliths lean together and almost meet, leaving a secret
  jagged CRACK of daylight sky — clouds drifting in the slot, raking light
  brushing down the faces, form-tie holes and diamond seams etched into the
  concrete. Sits right after UMBRELLA STONE in the set.

  Brief: keep it GLITTERING and RETRO. So on top of the architecture there is
  a twinkling glitter field (dense at the crack edges and along the light
  streaks), a heavy analog-film grade, and a CHROMA (RGB-split) filter that
  fringes every bright edge. Everything flashes loosely with the music
  (u_bass) — an exposure breathe + a rare 2-4 "frame" deconstruction where the
  walls shear into cool angular blocks, never a metronomic strobe.

  Loop-exact 30 s: all motion enters via circular offsets / integer harmonics
  of the loop phase, so the frame at t and t+30 is identical.

  PALETTE — canonical cold IL_* set (concrete + secret sky), per CLAUDE.md:
  near-black + graphite/blue concrete, IL_ICE + warm white for the sky slot,
  a whisper of IL_VIOLET in the shadow. The retro chroma split reads warm on
  one edge, cool on the other.

  Engine prelude (see CLAUDE.md): u_res u_time u_bass u_flow u_beat,
  hash()/vnoise()/fbm(), IL_* palette, ambientPost(col, fragCoord, bass).
======================================================================== -->
<script id="scene" type="x-shader/x-fragment">
#define TAU  6.28318530718
#define LOOP 30.0

// loop-exact domain flow: circular offsets at harmonics of ph, so any noise
// sampled through it is identical at t and t+LOOP (a true 30 s loop).
float flowFbm(vec2 p, float ph){
  vec2 c1 = 0.30 * vec2(cos(ph),         sin(ph));
  vec2 c2 = 0.18 * vec2(cos(2.0*ph+0.7), sin(2.0*ph+1.9));
  vec2 q  = vec2(fbm(p + c1), fbm(p + c1 + vec2(5.2, 1.3)));
  return fbm(p + 1.6*q + c2);
}

// crack centre + half-width as functions of height y (jagged, loop-periodic).
// The slot is a thin daylight thread at the bottom that flares wide toward the
// top — the "secret sky".
float crackCenter(float y, float ph){
  return 0.015*sin(y*3.3 + ph) + 0.05*(flowFbm(vec2(0.0, y*3.0), ph) - 0.5);
}
float crackHalf(float y, float ph){
  float w = 0.014 + 0.150*smoothstep(-0.30, 0.55, y);   // widen toward the sky
  w += 0.040*(flowFbm(vec2(3.1, y*8.0), ph*1.3) - 0.5); // jagged edges
  w += 0.018*(abs(fract(y*6.0 + 0.3*sin(ph)) - 0.5) - 0.25); // angular sawtooth notches
  return max(0.006, w);
}

// twinkling glitter: cellular stars that blink on loop-periodic phases.
float glitterLayer(vec2 p, float ph, float seed){
  vec2 g = floor(p), f = fract(p);
  float r  = hash(g + seed);
  if (r < 0.55) return 0.0;                              // only some cells hold a star
  vec2  star = vec2(hash(g + seed + 2.3), hash(g + seed + 5.7));
  float d    = length(f - star);
  float k    = 3.0 + floor(hash(g + seed + 9.1) * 9.0);  // integer harmonic -> loops
  float blink= 0.5 + 0.5*sin(ph*k + hash(g + seed + 4.4)*TAU);
  return smoothstep(0.10, 0.0, d) * pow(blink, 7.0);
}

// ---- structural field: concrete monoliths + secret-sky crack + raking light.
// Evaluated three times (R/G/B) for the chroma split, so keep it self-contained.
vec3 field(vec2 p, float ph, float bass, out float edge){
  float cx = crackCenter(p.y, ph);
  float ch = crackHalf(p.y, ph);
  float dx = abs(p.x - cx);

  float aa   = 0.004;
  float sky  = smoothstep(ch + aa, ch - aa, dx);        // 1 inside the crack
  edge = smoothstep(ch + 0.05, ch, dx) * (1.0 - sky);   // bright rim just outside

  // ---- secret sky in the slot: ice -> warm white, drifting clouds ----
  float sy    = clamp((p.y + 0.5), 0.0, 1.0);
  float cloud = flowFbm(vec2(p.x*2.4 + 4.0, p.y*3.2 - sy*1.5), ph*0.6);
  vec3  skyc  = mix(IL_ICE*0.92, IL_WARMWHITE, smoothstep(0.30, 0.9, cloud));  // keep some ice/cloud
  skyc = mix(skyc, IL_WARMWHITE*1.05, smoothstep(0.25, 0.8, sy)*0.35);  // brighter up high
  skyc *= 0.95 + 0.35*bass;                                            // slot breathes with the low end

  // ---- concrete faces (everything outside the crack) ----
  float side  = sign(p.x - cx);                          // -1 left wall, +1 right wall
  // raw board-formed tone: graphite-blue, mottled, faint violet in the shadow
  float mott  = fbm(p*5.5 + 13.0)*0.6 + fbm(p*17.0 + 2.0)*0.4;
  vec3  conc  = mix(IL_GRAPHITE, IL_BLUE, 0.35 + 0.3*mott);
  conc  = mix(conc, IL_VIOLET, 0.10);
  conc *= 0.42 + 0.34*mott;                              // dark, moody, flatter concrete body
  // horizontal formwork board lines (subtle)
  float board = smoothstep(0.06, 0.16, abs(fract(p.y*11.0) - 0.5));
  conc *= 0.88 + 0.12*board;
  // diagonal diamond panel seams (the signature X of the photo) — darker grooves
  float d1 = abs(fract((p.x + p.y)*2.3) - 0.5);
  float d2 = abs(fract((p.x - p.y)*2.3) - 0.5);
  float seam = smoothstep(0.0, 0.05, d1) * smoothstep(0.0, 0.05, d2);
  conc *= 0.72 + 0.28*seam;                              // grooves, not tufting
  // form-tie holes: dark dots on a diagonal grid, tiny lit lip
  vec2  hg = vec2(p.x + p.y, p.x - p.y) * 2.3;
  vec2  hf = fract(hg) - 0.5;
  float hole = smoothstep(0.11, 0.05, length(hf));
  conc *= 1.0 - 0.7*hole;
  conc += IL_WARMWHITE * 0.05 * smoothstep(0.16, 0.11, length(hf)) * smoothstep(0.05, 0.11, length(hf));

  // raking daylight brushed diagonally down each wall (slow drift, loop-periodic)
  float diag  = p.y*1.6 - side*p.x*1.1;
  float rake  = flowFbm(vec2(diag*2.0, p.y*1.2), ph*0.8);
  float streak= smoothstep(0.45, 0.95, rake);
  conc += mix(IL_ICE, IL_WARMWHITE, 0.6) * streak * (0.22 + 0.10*bass) * (0.6 + 0.5*mott);
  // ambient bounce from the bright slot onto the inner faces
  conc += IL_WARMWHITE * 0.35 * edge * (0.5 + 0.5*bass);

  vec3 col = mix(conc, skyc, sky);
  // crack rim bloom
  col += IL_WARMWHITE * edge * (0.35 + 0.6*bass);

  // ---- glitter: twinkles densest at the crack edges + along the streaks ----
  float gmask = clamp(edge*2.0 + streak*0.5 + sky*0.25, 0.0, 1.5);
  float glit  = glitterLayer(p*26.0, ph, 0.0)
              + glitterLayer(p*44.0 + 7.0, ph*1.37, 3.0)*0.7;
  col += mix(IL_ICE, IL_WARMWHITE, 0.5) * glit * gmask * (1.0 + 1.8*bass);

  return col;
}

void main(){
  vec2  R  = u_res;
  vec2  fc = gl_FragCoord.xy;
  vec2  p  = (fc - 0.5*R) / R.y;          // aspect-correct, y up, centred
  float bass = u_bass;
  float ph = TAU * u_time / LOOP;         // seamless 30 s loop phase

  // ---- flicker family (loop-exact high harmonics, non-metronomic) ----
  float ef    = 0.05*sin(ph*7.0 + 1.1) + 0.035*sin(ph*13.0 + 2.4) + 0.025*sin(ph*19.0);
  // rare 2-4 "frame" deconstruction surge — a couple of times per loop
  float surge = smoothstep(0.88, 1.0, 0.5+0.5*sin(ph*3.0)) *
                smoothstep(0.90, 1.0, 0.5+0.5*sin(ph*11.0 + 2.0));
  float shear = surge + 0.35*bass*surge;

  // deconstruction: shear the walls into cool horizontal blocks on a surge/bass
  float band = floor(p.y*10.0 + ph);
  float jit  = (hash(vec2(band, floor(ph*2.0))) - 0.5);
  p.x += jit * (0.010*bass + 0.06*shear) * step(0.45, hash(vec2(band, 3.7)));

  // ---- CHROMA (RGB) split: radial fringe, wider with the music + at surges ----
  vec2  rad = p;                          // from centre
  float ca  = 0.0032 + 0.007*bass + 0.02*surge;
  float e0, e1, e2;
  vec3  col;
  col.r = field(p + rad*ca, ph, bass, e0).r;
  col.g = field(p,          ph, bass, e1).g;
  col.b = field(p - rad*ca, ph, bass, e2).b;

  // ---- retro grade: exposure breathe, VHS scanline, whole-frame bloom ----
  col *= 1.0 + ef + 0.10*bass;
  float scan = 0.96 + 0.04*sin(fc.y*2.2 + u_time*1.5);     // faint analog scanline
  col *= scan;
  col += IL_WARMWHITE * surge * 0.10;                      // memory bloom on the deconstruction

  // tone-map the bright slot / glitter into [0,1) before the house S-grade
  // (ambientPost's S-contrast only behaves for col<1).
  col = vec3(1.0) - exp(-col * 1.25);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>
