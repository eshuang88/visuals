    const u=fade(x),v=fade(y),a=P[X]+Y,b=P[X+1]+Y;
    return lerp(lerp(grad(P[a],x,y),grad(P[b],x-1,y),u),lerp(grad(P[a+1],x,y-1),grad(P[b+1],x-1,y-1),u),v)*0.5+0.5;}
  function fbm(x,y){let v=0,a=0.5,f=1;for(let i=0;i<4;i++){v+=a*noise2(x*f,y*f);f*=2;a*=0.5;}return v;}

  const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
  const mix=(c1,c2,t)=>[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

  let grainCv=null, grainOn=true;
  function buildGrain(){
    grainCv=document.createElement('canvas');const gs=220;grainCv.width=gs;grainCv.height=gs;
    const gx=grainCv.getContext('2d');const id=gx.createImageData(gs,gs);
    for(let i=0;i<id.data.length;i+=4){const n=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=n;id.data[i+3]=255;}
    gx.putImageData(id,0,0);
  }

  // scene anchors (cropped 4:3 frame)
  const HOR=0.40, SUNX=0.48, SUNY=0.30, MOONX=0.72, MOONY=0.13;

  function draw(time){
    if(!vready){ ctx.fillStyle='#0a0806'; ctx.fillRect(0,0,W,H); return; }
    const cyc=(time%LOOP)/LOOP;
    const e=0.5+0.5*Math.cos(cyc*Math.PI*2);
    const d=Math.pow(e,0.85);
    const m=clamp(1-d);
    const bp=time/BEAT, beatFrac=bp-Math.floor(bp);
    const pulse=Math.exp(-beatFrac*6)*0.6+0.4*Math.pow(Math.sin(bp*Math.PI),2);
    const kick=Math.exp(-beatFrac*9);

    const horizon=H*HOR, glMax=H*0.62;
    const sunX=W*SUNX, sunGlowY=H*SUNY+(1-e)*H*0.34;
    const moonX=W*MOONX, moonY=H*MOONY;

    const camX=(fbm(time*0.6,1.3)-0.5)*W*0.012+(fbm(time*9,2)-0.5)*W*0.004;
    const camY=(fbm(time*0.6,7.7)-0.5)*H*0.012+(fbm(time*9,5)-0.5)*H*0.004+kick*H*0.006;
    const camRot=(fbm(time*0.5,3.1)-0.5)*0.010+(fbm(time*8,9)-0.5)*0.003;

    ctx.save();
    ctx.translate(W/2,H/2); ctx.scale(1.06,1.06); ctx.rotate(camRot);
    ctx.translate(-W/2+camX,-H/2+camY);

    // 1) live cinemagraph frame
    ctx.drawImage(vid,0,0,W,H);

    // 2) NIGHT GRADE — desaturate then cool-darken (never fully black)
    if(m>0.01){
      ctx.globalCompositeOperation='saturation';
      ctx.fillStyle=`rgba(128,128,128,${m*0.60})`; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='multiply';
      ctx.fillStyle=`rgba(54,72,116,${m*0.80})`; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='source-over';
    }

    // 3) SUN — warm flare + blurred core + water shimmer (sinks/rises)
    ctx.globalCompositeOperation='lighter';
    const flareR=W*(0.10+0.10*d)*(0.9+pulse*0.12);
    const flareA=(0.04+e*0.5)*(0.85+pulse*0.2);
    const fg=ctx.createRadialGradient(sunX,sunGlowY,0,sunX,sunGlowY,flareR);
    fg.addColorStop(0,rgba([255,238,190],flareA));
    fg.addColorStop(0.20,rgba([255,150,50],flareA*0.8));
    fg.addColorStop(0.55,rgba([230,80,24],flareA*0.3));
    fg.addColorStop(1,'rgba(180,40,10,0)');
    ctx.fillStyle=fg; ctx.fillRect(0,0,W,H);
    if(e>0.04){
      const R=W*0.045*(0.7+e*0.5);
      ctx.save();
      ctx.filter=`blur(${Math.max(1,R*0.42)}px)`;
      const ca=clamp(0.10+e*0.5);
      const core=ctx.createRadialGradient(sunX,sunGlowY,0,sunX,sunGlowY,R);
      core.addColorStop(0,rgba([255,250,236],ca));
      core.addColorStop(0.5,rgba([255,220,150],ca*0.7));
      core.addColorStop(1,'rgba(255,150,60,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(sunX,sunGlowY,R,0,7); ctx.fill();
      ctx.restore();
    }
    for(let y=horizon;y<glMax;y+=Math.max(2,DPR*1.6)){
      const depth=(y-horizon)/(glMax-horizon);
      const width=(0.02+depth*0.16)*W;
      const shimmer=Math.pow(fbm(sunX*0.02,y*0.05+time*1.4),2);
      const flick=0.5+0.5*Math.sin(time*6+y*0.4);
      const a=(0.04+e*0.42)*(1-depth*0.85)*shimmer*(0.5+flick*0.5)*(0.8+pulse*0.3);
      if(a<=0.004) continue;
      const gx=ctx.createLinearGradient(sunX-width,0,sunX+width,0);
      gx.addColorStop(0,'rgba(255,150,40,0)');
      gx.addColorStop(0.5,rgba([255,190,90],a));
      gx.addColorStop(1,'rgba(255,150,40,0)');
      ctx.fillStyle=gx; ctx.fillRect(sunX-width,y,width*2,Math.max(2,DPR*1.6));
    }
    ctx.globalCompositeOperation='source-over';

    // 4) MOON — cool glow + blue-white water shimmer
    if(m>0.02){
      ctx.globalCompositeOperation='lighter';
      const mR=W*0.13;
      const mg=ctx.createRadialGradient(moonX,moonY,0,moonX,moonY,mR);
      mg.addColorStop(0,rgba([214,226,255],0.40*m));
      mg.addColorStop(0.4,rgba([150,175,220],0.15*m));
      mg.addColorStop(1,'rgba(120,150,200,0)');
      ctx.fillStyle=mg; ctx.fillRect(0,0,W,horizon+H*0.06);
      const cR=W*0.018;
      const core=ctx.createRadialGradient(moonX,moonY,0,moonX,moonY,cR);
      core.addColorStop(0,rgba([236,242,255],0.75*m));
      core.addColorStop(1,'rgba(200,215,245,0)');
      ctx.fillStyle=core; ctx.beginPath(); ctx.arc(moonX,moonY,cR,0,7); ctx.fill();
      for(let y=horizon;y<glMax;y+=Math.max(3,DPR*2)){
        const depth=(y-horizon)/(glMax-horizon);
        const width=(0.015+depth*0.12)*W;
        const shimmer=Math.pow(fbm(moonX*0.02,y*0.06+time*1.1),2);
        const flick=0.5+0.5*Math.sin(time*5+y*0.5);
        const a=m*0.22*(1-depth*0.8)*shimmer*(0.5+flick*0.5)*(0.8+pulse*0.3);
        if(a<=0.004) continue;
        const gx=ctx.createLinearGradient(moonX-width,0,moonX+width,0);
        gx.addColorStop(0,'rgba(150,180,230,0)');
        gx.addColorStop(0.5,rgba([202,220,255],a));
        gx.addColorStop(1,'rgba(150,180,230,0)');
        ctx.fillStyle=gx; ctx.fillRect(moonX-width,y,width*2,Math.max(2,DPR*2));
      }
      ctx.globalCompositeOperation='source-over';
    }

    // 5) FOG — drifting veil hugging the horizon
    ctx.globalCompositeOperation='screen';
    const fogCol=mix([118,112,124],[212,162,120],d);
    const layers=[{y:-0.015,sp:0.02,a:0.09,sc:0.9},{y:0.03,sp:0.035,a:0.06,sc:1.6}];
    for(const L of layers){
      const off=time*L.sp;
      for(let x=0;x<W;x+=Math.max(8,DPR*6)){
        const n=fbm(x*0.004*L.sc+off,horizon*0.004+off*0.5);
        const h=(0.03+n*0.085)*H;
        const yy=horizon+L.y*H+Math.sin(x*0.01+time*0.4)*H*0.008;
        ctx.fillStyle=rgba(fogCol,L.a*n*(0.5+d*0.5+m*0.35));
        ctx.fillRect(x,yy-h,Math.max(8,DPR*6)+1,h*2);
      }
    }
    ctx.globalCompositeOperation='source-over';

    ctx.restore();

    // POST (fixed lens)
    const flickv=(fbm(time*26,41)-0.5)*0.05+kick*0.045+Math.sin(bp*Math.PI*2)*0.02;
    if(flickv>=0){ ctx.globalCompositeOperation='lighter'; ctx.fillStyle=rgba([255,215,160],flickv*0.85); }
    else { ctx.globalCompositeOperation='multiply'; ctx.fillStyle=`rgba(28,24,30,${-flickv*1.3})`; }
    ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';

    const vig=ctx.createRadialGradient(W*0.5,H*0.46,H*0.2,W*0.5,H*0.55,H*0.9);
    vig.addColorStop(0,'rgba(0,0,0,0)');
    vig.addColorStop(1,`rgba(4,6,12,${0.26+d*0.10})`);
    ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=0.04; ctx.fillStyle='#000';
    for(let y=0;y<H;y+=Math.max(2,Math.round(DPR*2))) ctx.fillRect(0,y,W,1);
    ctx.globalAlpha=1;

    if(grainOn&&grainCv){
      ctx.globalAlpha=0.045+m*0.03; ctx.globalCompositeOperation='overlay';
      const gs=grainCv.width, ox=(Math.random()*gs)|0, oy=(Math.random()*gs)|0;
      for(let y=-oy;y<H;y+=gs) for(let x=-ox;x<W;x+=gs) ctx.drawImage(grainCv,x,y);
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    }

    beatEl.style.background=`rgba(255,${100+pulse*120|0},${40+pulse*40|0},${0.35+pulse*0.65})`;
    beatEl.style.boxShadow=`0 0 ${4+pulse*10}px rgba(255,120,40,${0.3+pulse*0.5}),0 0 0 1px #3a2c22 inset`;
  }

  // transport
  const playBtn=document.getElementById('play'), grainBtn=document.getElementById('grain');
  const seek=document.getElementById('seek'), tRead=document.getElementById('t'), beatEl=document.getElementById('beat');
  let playing=true, clock=0, last=performance.now()/1000;
  const now=()=>performance.now()/1000;
  playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'❚❚ Pause':'▶ Play'; playBtn.classList.toggle('on',playing);
    last=now(); if(vready){ playing?vid.play().catch(()=>{}):vid.pause(); } };
  grainBtn.onclick=()=>{ grainOn=!grainOn; grainBtn.classList.toggle('on',grainOn); };
  seek.addEventListener('input',()=>{ clock=(+seek.value/1000)*LOOP; last=now(); });
  const fmt=v=>v.toFixed(1).padStart(4,'0');
  function frame(){
    const n=now(); if(playing) clock+=(n-last); last=n;
    const c=((clock%LOOP)+LOOP)%LOOP;
    draw(c); seek.value=(c/LOOP*1000)|0; tRead.textContent=`${fmt(c)} / 20.0`;
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  resize(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
