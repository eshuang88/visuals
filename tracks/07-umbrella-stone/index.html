<title>07 · Umbrella Stone — Imaginary Lands</title>
<link rel="stylesheet" href="../../lib/visual-core.css">
</head>
<body>

<!-- ========================================================================
  07 · UMBRELLA STONE  (IL_umbrellaStone)

  A generative reinterpretation of the umbrella-stone footage: two black rock
  headlands framing a bright slot over the sea, with rippling foreground water.
  Kept as a pure visual-core scene (no external footage), so it drops straight
  into the concert player and runs offline from file://.

  DELIBERATE PALETTE DEVIATION (per CLAUDE.md — noted here in the track file):
  magical RED · GOLD · BLACK · WHITE instead of the canonical cold IL_* set.
  The gap between the stones becomes a molten portal (crimson -> gold -> white);
  the stones stay near-black with glowing rim light; the water carries a red-gold
  reflection. Everything is a loop-exact 30s cycle (all motion enters via
  circular offsets at harmonics of the loop), and the portal / rim / glints
  flare with the music (u_bass), with a rare whole-frame "memory bloom".

  Engine prelude (see CLAUDE.md): u_res u_time u_bass u_flow u_beat,
  hash()/vnoise()/fbm(), IL_* palette, ambientPost(col, fragCoord, bass).
======================================================================== -->
<script id="scene" type="x-shader/x-fragment">
#define TAU  6.28318530718
#define LOOP 30.0

// ---- magical RED · GOLD · BLACK · WHITE palette (deliberate deviation) ----
const vec3 NIGHT   = vec3(0.020, 0.014, 0.030);  // near-black, faint violet
const vec3 CRIMSON = vec3(0.42,  0.055, 0.070);  // deep blood red
const vec3 EMBER   = vec3(0.86,  0.30,  0.10);   // red-orange coal
const vec3 GOLD    = vec3(1.00,  0.72,  0.28);   // gold
const vec3 GOLDHOT = vec3(1.00,  0.90,  0.60);   // hot gold
const vec3 WHITEW  = vec3(1.00,  0.96,  0.88);   // warm white
const vec3 STONE   = vec3(0.030, 0.026, 0.032);  // near-black stone

// loop-exact domain flow: every motion enters via circular offsets at harmonics
// of ph, so the whole frame is identical at t and t+LOOP (a true 30s loop).
float flowFbm(vec2 p, float ph){
  vec2 c1 = 0.35 * vec2(cos(ph),         sin(ph));
  vec2 c2 = 0.22 * vec2(cos(2.0*ph+1.1), sin(2.0*ph+0.3));
  vec2 q  = vec2(fbm(p + c1), fbm(p + c1 + vec2(3.7, 1.9)));
  return fbm(p + 1.7*q + c2);
}

void main(){
  vec2  Rz = u_res;
  vec2  fc = gl_FragCoord.xy;
  vec2  p  = (fc - 0.5*Rz) / Rz.y;        // aspect-correct, y up, centered
  float bass = u_bass;

  float ph = TAU * u_time / LOOP;         // seamless 30s loop phase

  // ---- flicker family: high harmonics of ph (loop-exact, non-metronomic) ----
  float ef     = 0.055*sin(ph*7.0+1.3) + 0.040*sin(ph*11.0+2.1) + 0.030*sin(ph*17.0);
  float shiver = 0.5 + 0.5*sin(ph*23.0 + 1.7*sin(ph*5.0));
  // rare 2-3 "frame" memory bloom — a couple of magical surges per loop, not a strobe
  float surge  = smoothstep(0.86, 1.0, 0.5+0.5*sin(ph*3.0)) *
                 smoothstep(0.90, 1.0, 0.5+0.5*sin(ph*13.0+2.0));
  float flare  = 0.55 + 0.60*bass + 0.9*surge;   // portal drive: flares with the music

  float aa = 0.006;
  float hy = 0.10;                        // horizon height

  // waterline (rock bases sink here), gently rippled + loop-periodic
  float wy = -0.075 + 0.012*sin(p.x*9.0 + ph) + 0.020*flowFbm(vec2(p.x*3.0, 1.0), ph);
  float above = smoothstep(wy-aa, wy+aa, p.y);

  // ---- geometry: two black headlands, apex nearly meeting at the horizon ----
  float dyl = p.y - hy;
  float xL  = -0.03 - 1.70*max(-dyl, 0.0) - 0.55*max(dyl, 0.0);   // right edge of left rock
  xL += 0.018*fbm(vec2(p.y*7.0, 2.3)) - 0.009;                    // craggy edge
  float axL  = p.x + 0.32;
  float topL = 0.36 - 1.10*axL*axL;                              // rounded dome top
  topL += 0.020*fbm(vec2(p.x*6.0, 5.0)) - 0.010;

  float dyr = p.y - hy;
  float xR  = 0.06 + 1.90*max(-dyr, 0.0) + 0.60*max(dyr, 0.0);   // left edge of right rock
  xR += -0.016*fbm(vec2(p.y*8.0, 7.1)) + 0.008;
  float axR  = p.x - 0.45;
  float topR = 0.16 - 1.00*axR*axR;                             // lower, angular top
  topR += 0.018*fbm(vec2(p.x*7.0, 9.0)) - 0.009;

  float mL = smoothstep(xL+aa, xL-aa, p.x) * smoothstep(topL+aa, topL-aa, p.y) * above;
  float mR = smoothstep(xR-aa, xR+aa, p.x) * smoothstep(topR+aa, topR-aa, p.y) * above;
  float rock = max(mL, mR);

  // ---- sky: magical dusk gradient (gold horizon -> crimson -> night) ----
  float st  = clamp((p.y - hy)/(0.5 - hy), 0.0, 1.0);
  vec3  sky = mix(GOLD*0.8, CRIMSON, smoothstep(0.0, 0.30, st));
  sky = mix(sky, NIGHT, smoothstep(0.22, 1.0, st));
  float cloud = flowFbm(vec2(p.x*2.2, p.y*3.0 + 2.0), ph*0.5);
  sky = mix(sky, sky*vec3(1.15, 1.02, 0.9), smoothstep(0.4, 0.9, cloud)*0.35*(1.0-st));

  // ---- portal glow in the gap ----
  vec2  pc = vec2(0.04, hy + 0.005);
  float d  = length((p - pc) * vec2(1.0, 1.55));
  vec3  portal = CRIMSON * exp(-d*3.0)  * 1.3
               + GOLD    * exp(-d*6.5)  * 1.5
               + WHITEW  * exp(-d*15.0) * 1.4;
  portal *= flare;
  vec3 col = sky + portal;

  // ---- distant crashing waves: molten foam band in the slot ----
  float gxN = (p.x - 0.04) / 0.16;
  float gapCenter = exp(-gxN*gxN);
  float band  = smoothstep(hy+0.02, hy-0.01, p.y) * smoothstep(wy-0.01, wy+0.05, p.y);
  float churn = flowFbm(vec2(p.x*6.0, p.y*11.0 + 3.0), ph*1.7);
  float foam  = smoothstep(0.5, 0.95, churn);
  col += mix(GOLD, WHITEW, foam) * band * gapCenter * (0.6 + 0.8*foam) * (0.8 + 0.6*bass);

  // ---- foreground water: dark, red-gold reflection of the gap + glints ----
  float depth  = wy - p.y;
  float belowW = smoothstep(wy+aa, wy-aa, p.y);
  float ripple = flowFbm(vec2(p.x*3.0, p.y*7.0),  ph);
  float fine   = flowFbm(vec2(p.x*9.0, p.y*20.0), ph*1.3);
  float rxN    = (p.x - 0.04) / 0.30;
  float refl   = exp(-rxN*rxN) * exp(-max(depth, 0.0)*3.2);   // reflection column under the slot
  vec3  water  = mix(NIGHT*0.7, CRIMSON*0.55, refl);
  water += EMBER * refl * 0.5 * smoothstep(0.4, 0.9, ripple);
  float glint = smoothstep(0.72, 0.98, fine) * smoothstep(0.55, 0.95, ripple);
  water += GOLD * glint * (0.25 + 0.7*refl) * (0.5 + 0.9*bass) * (0.7 + 0.6*shiver);
  water *= 0.85 + 0.30*ripple;                               // undulating tone
  col = mix(col, water, belowW);

  // ---- rocks on top: rough near-black stone + glowing rim toward the gap ----
  float relief = fbm(p*6.5 + 11.0)*0.6 + fbm(p*15.0 + 2.0)*0.4;
  vec3  rk = STONE * (0.45 + 0.9*relief);
  rk += EMBER * 0.12 * exp(-d*2.2) * (0.6 + 0.6*relief);      // faint portal bleed on the faces
  float rimL = smoothstep(0.055, 0.0, xL - p.x) * mL;
  float rimR = smoothstep(0.055, 0.0, p.x - xR) * mR;
  float rim  = max(rimL, rimR);
  rk += mix(EMBER, GOLDHOT, rim) * rim * (0.5 + 1.1*bass) * (0.6 + 0.8*shiver) * (0.8 + 1.2*surge);
  col = mix(col, rk, rock);

  // ---- global flicker: exposure breathe + rare whole-frame memory bloom ----
  col *= 1.0 + ef + 0.12*bass;
  col += WHITEW * surge * 0.12;

  // soft highlight rolloff: the molten portal / foam / glints push well past 1.0,
  // so tone-map into [0,1) first — ambientPost's S-contrast only behaves there
  // (col>1 makes col*col*(3-2col) go negative -> false colour). The hot core
  // lands as warm white with a gold-crimson halo.
  col = vec3(1.0) - exp(-col * 1.15);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>

<script src="../../lib/visual-core.js"></script>
<script>
  Ambient.start({
    title: 'UMBRELLA STONE',
    subtitle: 'ambient techno · 07 · 4:3<br>紅金黑白 · 傘石之門 — 點擊進入全螢幕，允許麥克風以隨低音起伏',
    bpm: 115
  });
</script>
</body>
