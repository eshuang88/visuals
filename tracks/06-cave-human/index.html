<!-- ========================================================================
  06 · CAVE HUMAN — footage track (Moonvoid / Rival Consoles direction).

  A slow handheld drift across a cave wall, treated as a decaying analog
  transmission: heavy grain, VHS chroma bleed / chromatic aberration, tape
  wobble, scanlines, exposure breathing. The stone is the sculptural object
  held in near-black; the "chroma" filter and grain are the memory it's stored
  on. Deliberate palette deviation: warmer than canonical — the rock keeps a
  little of its ember/ochre through the cold cast, per CLAUDE.md's per-track
  license.

  Source: assets/cave-human-loop.mp4 — a 30s seamless 4:3 loop (forward +
  reverse palindrome, so it drifts one way then breathes back; no seam).
  The engine keeps its current frame in u_tex; sample with il_frame(uv).
======================================================================== -->
<script id="scene" type="x-shader/x-fragment">
// ---- small periodic helpers so every modulation stays seamless ----
float spark(float t, float ph, float k){ return pow(max(0.0, sin(t + ph)), k); } // rare, non-metronomic

void main(){
  vec2 uv   = gl_FragCoord.xy / u_res;
  float bass = u_bass;

  // slow analog-instability envelopes (u_flow accumulates -> never wraps)
  float breathe = 0.5 + 0.5 * sin(u_flow * 1.3);

  // ---- VHS tape wobble: per-line horizontal jitter, filthy band at the bottom ----
  float wob  = (vnoise(vec2(uv.y * 90.0, u_time * 0.8)) - 0.5)
             + 0.5 * (vnoise(vec2(uv.y * 12.0, u_time * 0.33)) - 0.5);
  float headSwitch = smoothstep(0.05, 0.0, uv.y);                 // dirty tracking band, very bottom
  float jitter = wob * (0.0014 + 0.0024 * bass)
               + headSwitch * (vnoise(vec2(u_time * 26.0, 3.0)) - 0.5) * 0.02;
  vec2 suv = uv + vec2(jitter, 0.0);

  // ---- chroma bleed / chromatic aberration (the retro "chroma" filter) ----
  float rad = length(uv - 0.5);
  float ca  = 0.0040 + 0.0060 * bass + 0.0022 * breathe + 0.0040 * rad;  // edges + breath
  vec3 col;
  col.r = il_frame(suv + vec2( ca,        0.0)).r;
  col.g = il_frame(suv + vec2( 0.0,       0.0)).g;
  col.b = il_frame(suv + vec2(-ca,        0.0)).b;
  // second, softer horizontal smear on the chroma channels (tape delay)
  vec3 smear = il_frame(suv + vec2(ca * 2.4, 0.0));
  col.rb = mix(col.rb, smear.rb, 0.22);

  float luma = dot(col, vec3(0.299, 0.587, 0.114));

  // ---- cheap halation: 4-tap blur, glow only the highlights ----
  float e = 0.0045;
  vec3 blur = il_frame(suv + vec2(e, 0.0)) + il_frame(suv - vec2(e, 0.0))
            + il_frame(suv + vec2(0.0, e)) + il_frame(suv - vec2(0.0, e));
  blur *= 0.25;
  float hi = smoothstep(0.62, 1.0, dot(blur, vec3(0.299, 0.587, 0.114)));

  // ---- cold IL grade across luma; hold it in near-black, let stone keep a little ember ----
  // crush the blacks and pull exposure down so the wall lives in darkness (Rival Consoles)
  luma = pow(luma, 1.35) * 0.92;
  vec3 ramp = mix(IL_BLACK, IL_BLUE, smoothstep(0.06, 0.52, luma));
  ramp = mix(ramp, IL_WARMWHITE, smoothstep(0.64, 1.02, luma) * 0.82); // less blown highlights
  ramp += IL_VIOLET * 0.16 * smoothstep(0.28, 0.0, luma);          // violet sunk in the dark
  vec3 lowsat = mix(vec3(luma), col * 0.9, 0.42);                   // desaturated footage, kept low
  vec3 outc = mix(ramp, lowsat, 0.34);                             // mostly the cold ramp, texture kept
  outc = mix(outc, outc * IL_EMBER * 1.9, 0.10 * smoothstep(0.3, 0.8, luma)); // ember in the mids

  outc += IL_WARMWHITE * hi * (0.10 + 0.06 * bass);                // halation, restrained

  // ---- retro raster: gentle scanlines + faint aperture, fixed count (not busy) ----
  outc *= 0.94 + 0.06 * sin(uv.y * 486.0 * 3.14159265);
  outc *= 0.985 + 0.015 * sin(uv.x * 610.0 * 3.14159265);

  // ---- exposure breathing + rare 2-4 frame dropouts (flicker as an instrument) ----
  float expo = 1.0 + 0.055 * sin(u_flow * 1.7) + 0.03 * sin(u_time * 0.09);
  expo += 0.10 * spark(u_time * 0.13, 1.3, 60.0)                   // rare surge
        - 0.14 * spark(u_time * 0.11, 4.7, 90.0);                  // rare dip
  outc *= expo;

  // ---- rare vertical tape scratch: thin, dim, sparsely gated, drifts off-centre ----
  float sx  = fract(u_time * 0.017 + hash(vec2(floor(u_time / 6.0), 2.0)));  // new position each burst
  float gate = step(0.80, vnoise(vec2(floor(u_time / 6.0), 9.0)));           // on ~20% of 6s windows
  outc += smoothstep(0.0011, 0.0, abs(uv.x - sx)) * gate * 0.09;

  // ---- crush + noise the tracking band at the bottom ----
  outc = mix(outc, outc * 0.55 + hash(gl_FragCoord.xy + fract(u_time) * 51.0) * 0.12, headSwitch * 0.6);

  gl_FragColor = vec4(ambientPost(outc, gl_FragCoord.xy, bass), 1.0);
}
</script>
