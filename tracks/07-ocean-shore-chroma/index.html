<!-- Scene: IL_oceanShore_chroma — FOOTAGE track (the project's footage half).
     Source: IL_oceanShore — a high-angle shoreline (teal sea · white surf · wet
     grey-green sand laced with foam). The real clip plays as the base
     (assets/ocean-shore.{webm,mp4}, a seamless ~9s boomerang loop), treated in
     the house style and pushed into a grainy, retro, chroma-split register:

       · chroma     — the requested "chroma filter": radial chromatic aberration
                      (R/B fringe out from centre, heavier at the edges) plus a
                      horizontal VHS-style chroma bleed. Both breathe on a ~30s
                      cycle and swell with u_bass. Emotion sync, not beat sync.
       · retro      — coarse animated film grain (density modulated, per the
                      flicker family), a slow rolling exposure bar / gate weave,
                      faint scanline structure, warm-white halation off the foam.
       · flow-warp  — the footage UV is domain-warped by u_flow (+ u_bass), so the
                      water liquefies a touch beyond its own motion.
       · framing    — texCoverUV() fits the 4:3 clip; a slow drift pans a slight
                      zoom-crop so no two passes of the loop frame identically.
       · grade      — pulled low-saturation into the canonical IL palette
                      (near-black sand · desaturated-blue / ice water · warm-white
                      foam · muted violet in the mid-shadows), then ambientPost.

     The footage loops every ~9s but the treatment cycle is ~30s and u_flow /
     u_time never wrap, so the chroma breath, drift, warp phase and exposure keep
     evolving — a 30s loop that stays alive well past it, never a hard cut. The
     boomerang (forward + reverse) sidesteps the handheld clip's camera tilt: it
     retraces the exact path, so it is seam-free at both ends; the velocity turn
     reads as the tide breathing in and out. Palette stays canonical + low-sat. -->
<script id="scene" type="x-shader/x-fragment">
#define TAU 6.28318530718

// iterative domain warp -> the slow liquid push laid over the footage.
vec2 flowWarp(vec2 p, float flow, float bass){
  vec2 q = vec2(fbm(p*1.2           + vec2(0.0, -flow)),
                fbm(p*1.2 + vec2(5.2,1.3) - vec2(0.0, flow*0.8)));
  vec2 r = vec2(fbm(p*1.6 + 1.7*q + vec2(1.7,9.2)),
                fbm(p*1.6 + 1.7*q + vec2(8.3,2.8)));
  return (r - 0.5) * (0.5 + bass);            // displacement, breathing with the bass
}

// sample the footage with a per-channel chromatic split (the "chroma" filter).
vec3 sampleChroma(vec2 uvf, vec2 caOff, vec2 bleed){
  float R = texture2D(u_tex, clamp(uvf + caOff + bleed, 0.001, 0.999)).r;
  float G = texture2D(u_tex, clamp(uvf,                  0.001, 0.999)).g;
  float B = texture2D(u_tex, clamp(uvf - caOff - bleed, 0.001, 0.999)).b;
  return vec3(R, G, B);
}

void main(){
  vec2 uv01 = gl_FragCoord.xy / u_res;        // 0..1 stage space
  float bass = u_bass;
  float flow = u_flow;
  float t    = u_time;

  // --- the ~30s treatment cycle (dominant), plus slower out-of-phase breaths ---
  float c30  = t * TAU / 30.0;                  // one turn every 30s (the "loop")
  float slow = 0.5 + 0.5*sin(t*0.026 + 1.7);    // ~240s, keeps it alive past 30s
  float breath = 0.5 + 0.5*sin(c30);            // 0..1 on the 30s cycle

  vec2 asp = vec2(u_res.x/u_res.y, 1.0);
  vec2 wcoord = (uv01 - 0.5) * asp;

  // --- flow-warp the sampling coordinate (aspect-corrected so it's not squashed) ---
  vec2 disp = flowWarp(wcoord*1.5, flow, bass) * (0.009 + 0.012*bass);

  // --- gate weave: a tiny slow positional wobble (retro film-gate float) ---
  vec2 weave = vec2(0.0018*sin(t*0.53), 0.0014*cos(t*0.41)) * (0.6 + 0.6*breath);

  // --- slow drift + slight zoom-crop so no two passes frame alike ---
  vec2 drift = vec2(0.014*sin(t*0.019) + 0.008*(slow-0.5),
                    0.011*cos(t*0.015) + 0.006*(breath-0.5));
  vec2 uvw = uv01 + disp / asp + weave;
  vec2 uvf = (texCoverUV(uvw) - 0.5) / 1.10 + 0.5 + drift;   // 1.10 zoom hides edges

  // --- chroma split amounts: radial CA (edge-weighted) + horizontal VHS bleed ---
  vec2 dir = uvf - 0.5;
  float rad = dot(dir, dir);                                  // r^2, 0 centre -> edges
  float caA = (0.0022 + 0.0040*bass + 0.0026*breath) * (0.35 + 2.4*rad);
  vec2 caOff = dir * (caA / max(length(dir), 1e-4));          // fringe along the radius
  // horizontal chroma bleed drifts and wanders (tape smear), never metronomic
  float smear = 0.0012 + 0.0016*bass + 0.0018*(0.5+0.5*sin(c30*0.8 + wcoord.y*3.0));
  vec2 bleed = vec2(smear, 0.0);

  vec3 src = sampleChroma(uvf, caOff, bleed);

  // tone into the house range. Source is high-key (bright foam) so pull it DOWN:
  // darken the mids, then a soft highlight knee so the surf reads as luminous
  // grey-white, never a clipped paper-white band.
  src = pow(clamp(src, 0.0, 1.0), vec3(1.42)) * 0.86;
  src = mix(src, 0.52 + (src - 0.52) / (1.0 + (src - 0.52) * 3.2),
            step(0.52, src));                                 // soft highlight knee

  float L = dot(src, vec3(0.30, 0.59, 0.11));                 // luma

  // grade = wash toward the IL palette ramp (keep the footage texture underneath).
  // upper-mids go COOL (ice) and only the true crests go warm-white, so the foam
  // sits in the cold house body instead of blowing the frame out.
  vec3 ramp = IL_BLACK;
  ramp = mix(ramp, IL_GRAPHITE,  smoothstep(0.03, 0.20, L));
  ramp = mix(ramp, IL_BLUE,      smoothstep(0.16, 0.46, L));
  ramp = mix(ramp, IL_ICE,       smoothstep(0.40, 0.74, L));
  ramp = mix(ramp, IL_WARMWHITE, smoothstep(0.74, 0.96, L) * 0.85);
  vec3 col = mix(src, ramp, 0.62);                            // palette wash
  col = mix(vec3(L), col, 0.78);                              // low-sat, but keep the cold teal
  col *= vec3(0.97, 0.99, 1.03);                              // nudge the whole body cold
  col += IL_VIOLET * 0.06 * smoothstep(0.30, 0.05, L) * (0.6 + 0.5*slow); // violet mid-shadow

  // warm-white halation: bloom lifted off the bright foam, pooled by a slow field
  float weather = fbm(wcoord*0.9 + vec2(0.0, -flow*0.4) + 4.0);
  float crest = smoothstep(0.55, 0.95, L);
  col += IL_WARMWHITE * crest * crest * (0.10 + 0.12*weather) * (0.7 + 0.6*bass);
  // faint ice tint in the wet shadows (cold water side)
  col += IL_ICE * 0.05 * smoothstep(0.34, 0.08, L) * (0.6 + 0.4*breath);

  // --- retro chrome: rolling exposure bar, faint scanlines, exposure breath ---
  float bar = sin((uv01.y - t*0.03) * TAU);                   // slow vertical roll
  col *= 1.0 + 0.030 * bar * (0.5 + 0.5*breath);
  float scan = 0.5 + 0.5*sin(uv01.y * 240.0 * TAU * 0.5);     // fixed ~240-line CRT
  col *= 1.0 - 0.045 * scan;
  col *= 1.0 + 0.035*sin(t*0.70 + weather*4.0);               // non-metronomic breath

  // --- coarse animated film grain (density modulated — the flicker family) ---
  float gN = hash(floor(gl_FragCoord.xy / 1.5) + fract(t*0.9)*vec2(53.7, 17.3));
  float gDensity = 0.05 + 0.045*breath + 0.05*bass;           // grain breathes over 30s
  col += (gN - 0.5) * gDensity * (0.35 + 1.1*L);              // grain lives in the mids/foam

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>
