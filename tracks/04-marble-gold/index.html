<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>04 · Marble Gold — Imaginary Lands</title>
<link rel="stylesheet" href="../../lib/visual-core.css">
</head>
<body>

<!-- Scene: marbled liquid metal. Four non-overlapping rectilinear tangram blocks
     filled with domain-warped fbm veining — deep bronze valleys, gold, white-hot
     flow — with creamy chrome streaks and faint blue / red / green temperature
     pockets. Gold-dominant (the Floating Points / flyer direction, warmer).

     Uses the engine prelude (fbm, ambientPost) + standard uniforms. Motion is a
     seamless 30s loop: all time-dependence enters through ph = TAU*u_time/30, with
     domain-warp offsets orbiting on circles, so the veining returns exactly to its
     start each pass. u_bass is a live overlay (heat swell) over the loop. -->
<script id="scene" type="x-shader/x-fragment">
#define TAU  6.28318530718
#define LOOP 30.0

/* ---- rectilinear SDF helpers ---- */
float sdBox(vec2 p, vec2 c, vec2 h){ vec2 d=abs(p-c)-h; return length(max(d,0.0))+min(max(d.x,d.y),0.0); }
float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2){
  vec2 e0=p1-p0,e1=p2-p1,e2=p0-p2;
  vec2 v0=p-p0,v1=p-p1,v2=p-p2;
  vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
  vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
  vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);
  float s=sign(e0.x*e2.y-e0.y*e2.x);
  vec2 d=min(min(vec2(dot(pq0,pq0),s*(v0.x*e0.y-v0.y*e0.x)),
                 vec2(dot(pq1,pq1),s*(v1.x*e1.y-v1.y*e1.x))),
                 vec2(dot(pq2,pq2),s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y);
}

/* 4 non-overlapping tangram blocks (uv 0..1, y up) */
float blockSD(int id, vec2 p){
  if(id==0){ float a=sdBox(p,vec2(0.295,0.795),vec2(0.250,0.160));
             float b=sdBox(p,vec2(0.140,0.517),vec2(0.095,0.117)); return min(a,b); }
  if(id==1) return sdBox(p,vec2(0.775,0.632),vec2(0.180,0.322));
  if(id==2) return sdBox(p,vec2(0.415,0.500),vec2(0.130,0.100));
  return      sdBox(p,vec2(0.500,0.157),vec2(0.455,0.112));
}

/* gold thermal ramp: deep bronze valleys -> gold -> white-hot */
vec3 goldRamp(float h){
  h=clamp(h,0.0,1.0);
  vec3 c0=vec3(0.045,0.030,0.020);
  vec3 c1=vec3(0.30,0.17,0.05);
  vec3 c2=vec3(0.60,0.40,0.11);
  vec3 c3=vec3(0.90,0.70,0.26);
  vec3 c4=vec3(1.00,0.94,0.62);
  vec3 c5=vec3(1.00,0.99,0.92);
  vec3 c;
  if(h<0.2)      c=mix(c0,c1,smoothstep(0.0,0.2,h));
  else if(h<0.45)c=mix(c1,c2,smoothstep(0.2,0.45,h));
  else if(h<0.65)c=mix(c2,c3,smoothstep(0.45,0.65,h));
  else if(h<0.85)c=mix(c3,c4,smoothstep(0.65,0.85,h));
  else           c=mix(c4,c5,smoothstep(0.85,1.0,h));
  return c;
}
/* subtle temperature casts — gold stays dominant */
vec3 tempTint(float t, float h){
  vec3 c=vec3(1.0);
  c=mix(c, vec3(0.45,0.68,1.25), smoothstep(0.60,0.9,1.0-t)*(1.0-h)*0.65); // cool blue
  c=mix(c, vec3(1.35,0.55,0.42), smoothstep(0.72,0.96,t)*smoothstep(0.55,0.9,h)*0.6); // hot red
  c=mix(c, vec3(0.55,1.20,0.72), smoothstep(0.46,0.54,t)*(1.0-abs(h-0.5)*1.5)*0.35); // green pocket
  return c;
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;     // 0..1, y up
  float aspect = u_res.x / u_res.y;
  float ph = TAU * u_time / LOOP;
  float aa = 1.5 / u_res.y;

  /* which of the 4 blocks owns this pixel */
  int bid=-1; float cover=0.0;
  for(int i=0;i<4;i++){
    float d=blockSD(i,uv);
    cover=max(cover, 1.0-smoothstep(0.0,aa,d));
    if(d<0.0) bid=i;
  }

  /* brown near-black between blocks */
  vec3 bg=vec3(0.050,0.038,0.029);
  bg*=0.72+0.28*fbm(uv*2.2+7.0);
  vec3 col=bg;

  if(bid>=0){
    /* marbled liquid-metal: domain-warped fbm veining, per-block seed */
    float sk=float(bid);
    vec2 hp=uv*vec2(aspect,1.0)*3.2 + vec2(sk*11.3, sk*7.7);
    vec2 c1v=vec2(cos(ph),sin(ph))*0.55;
    float w1=fbm(hp+c1v);
    vec2 hp2=hp+1.35*vec2(w1, fbm(hp+c1v+3.1));
    vec2 c2v=vec2(cos(ph*0.73+1.7),sin(ph*0.73+1.7))*0.42;
    float w2=fbm(hp2+c2v);
    vec2 hp3=hp2+1.0*vec2(w2, fbm(hp2+c2v+6.2));
    float heat=fbm(hp3);
    float temp=fbm(hp3*0.6+20.0+vec2(cos(ph*0.4),sin(ph*0.4))*0.3);
    heat=clamp(heat*1.18-0.06+u_bass*0.24, 0.0, 1.0);
    heat=mix(heat, smoothstep(0.05,0.95,heat), 0.35); // deepen molten valleys

    vec3 fluid=goldRamp(heat);

    /* creamy chrome streaks from the veining gradient (central diff, no dFdx) */
    float e=0.006;
    float hx=(fbm(hp3+vec2(e,0.0))-fbm(hp3-vec2(e,0.0)))/(2.0*e);
    float hy=(fbm(hp3+vec2(0.0,e))-fbm(hp3-vec2(0.0,e)))/(2.0*e);
    float gm=length(vec2(hx,hy));
    vec2 gdir = gm>1e-4 ? vec2(hx,hy)/gm : vec2(1.0,0.0);
    float ang=atan(gdir.y, gdir.x);
    float chrome=pow(0.5+0.5*sin(ang*3.0+heat*10.0+ph*1.3), 1.5);
    vec3 cream=vec3(0.96,0.91,0.79);
    fluid=mix(fluid, fluid*cream*(0.55+0.9*chrome), 0.34*smoothstep(0.30,0.80,heat));

    /* temperature variety (blue / red / green pockets) */
    fluid=mix(fluid, fluid*tempTint(temp,heat), 0.30);

    /* cold-white specular flicker on the sheen — non-metronomic, lifts on bass */
    float flick = clamp(0.35 + 0.65*fbm(vec2(u_time*1.6, 11.0)) + u_bass*0.4, 0.0, 1.0);
    float sheen=smoothstep(0.4, 3.5, gm);
    fluid+=vec3(0.80,0.90,1.0)*sheen*chrome*(0.16+0.84*flick)*smoothstep(0.55,0.96,heat);

    col = mix(bg, fluid, cover);

    /* etched triangle motif inside the tall-right block */
    if(bid==1){
      float dtri=abs(sdTri(uv, vec2(0.775,0.720), vec2(0.660,0.460), vec2(0.890,0.460)));
      float tl=1.0-smoothstep(0.0018,0.0018+aa,dtri);
      col=mix(col, vec3(0.85,0.90,1.02), tl*0.30);
    }
  }

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, u_bass), 1.0);
}
</script>

<script src="../../lib/visual-core.js"></script>
<script>
  Ambient.start({
    title: 'MARBLE GOLD',
    subtitle: 'ambient techno · 04 · 4:3 · 30s loop<br>點擊進入全螢幕 — 允許麥克風以隨低音起伏<br><span style="opacity:.6">(無訊號時預設 115&nbsp;BPM)</span>',
    bpm: 115
  });
</script>
</body>
</html>
