<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>07 · Doorway Sea — Imaginary Lands</title>
<link rel="stylesheet" href="../../lib/visual-core.css">
</head>
<body>

<!-- Scene: IL_doorwaySea — a stylised THRESHOLD (Moonvoid direction, crossed with
     Rival Consoles' "framed view / light as protagonist"). Built from a photo of a
     concrete doorway opening onto a tropical lawn + ocean: dark side walls, a low
     ceiling beam, a tiled interior floor, and a bright aperture revealing pale sill
     -> grass -> a thin halated sea line -> sky, with a dark potted plant in the
     bottom-right corner.

     NOT photoreal — a flat, blocky reinterpretation. Per the brief, each colour
     BLOCK breathes on its own: wallCol / floorCol / beam / and every band inside
     the view get an independent flick() (a small brightness shimmer). The blocks
     wink out of step with one another, never as a group beat.

     30s LOOP: all time-dependence enters through PH = TAU*u_time/30 and its integer
     harmonics (and every drifting noise uses circular cos/sin(PH) offsets), so the
     whole frame returns exactly to its start every 30 s — seamless AND perfectly
     periodic. u_bass stays a live overlay (frame swell, horizon halation, plant/
     grass life); it never breaks the geometric loop.

     House flicker family present: per-block texture flicker, slow focus drift
     (edge softness breathes), exposure flutter, a rare light-leak sweep, horizon
     halation. Frequencies sit at ~0.2-0.6 Hz — a shimmer, not a strobe.

     PALETTE NOTE — deliberate deviation: the tropical source wants a live sky-blue
     and a grass-green, so this track carries a touch more colour than the canonical
     low-saturation house palette. The values are kept muted/filmic (no neon), the
     frame stays cool graphite, and IL_BLACK / IL_WARMWHITE anchor the plant and the
     halation, so it still wears the house skin. -->
<script id="scene" type="x-shader/x-fragment">
#define TAU  6.28318530718
#define LOOP 30.0

// set once at the top of main(); the region helpers below read them.
float PH;     // loop phase: 0..TAU across 30 s
float BASS;   // live low-end (mic, or BPM fallback)

// --- per-block flicker -------------------------------------------------------
// irregular sum of high loop-harmonics, unique per seed -> each block's
// brightness shimmers on its own phase. Every term is an integer harmonic of PH,
// so a block re-syncs exactly at 30 s, yet neighbouring blocks never wink together.
float flick(float seed){
  return 0.60*sin(PH*6.0  + seed*1.7)
       + 0.40*sin(PH*10.0 + seed*3.1 + 1.2)
       + 0.28*sin(PH*15.0 + seed*2.3 + 0.5);
}

// faint etched rectangle outline (the concrete wall panels) -> 1 near the border.
float rectBorder(vec2 p, vec2 a, vec2 b, float t){
  float inside = step(a.x,p.x)*step(p.x,b.x)*step(a.y,p.y)*step(p.y,b.y);
  vec2 d = min(abs(p-a), abs(p-b));
  return inside * smoothstep(t, 0.0, min(d.x, d.y));
}

// side walls: mottled cool graphite + a couple of faint etched panels + flicker.
vec3 wallCol(vec2 uv, float leftSide){
  float m = fbm(uv*3.0 + 5.0);
  vec3 base = vec3(0.235, 0.262, 0.250) * (0.86 + 0.24*m);
  float pan = 0.0;
  if(leftSide > 0.5){
    pan += rectBorder(uv, vec2(0.030, 0.30), vec2(0.205, 0.855), 0.010);
    pan += rectBorder(uv, vec2(0.050, 0.055), vec2(0.190, 0.260), 0.010);
  } else {
    pan += rectBorder(uv, vec2(0.795, 0.30), vec2(0.970, 0.855), 0.010);
    pan += rectBorder(uv, vec2(0.810, 0.055), vec2(0.950, 0.260), 0.010);
  }
  base += pan * 0.045;                                   // etch lines catch light
  base *= 1.0 + 0.050*flick(leftSide > 0.5 ? 11.0 : 21.0);
  return base;
}

// interior floor: cool grey + faint tile joints + flicker.
vec3 floorCol(vec2 uv){
  float m = fbm(uv*4.0 + 9.0);
  vec3 base = vec3(0.285, 0.305, 0.298) * (0.90 + 0.16*m);
  vec2 g = fract(vec2(uv.x*7.0, (uv.y + 0.02)*11.0));
  float j = smoothstep(0.035, 0.0, min(g.x, 1.0-g.x))
          + smoothstep(0.050, 0.0, min(g.y, 1.0-g.y));
  base -= j * 0.035;
  base *= 1.0 + 0.045*flick(31.0);
  return base;
}

// the view through the doorway: pale sill -> grass -> thin sea+halation -> sky.
// each band carries its own flick(); w is the (breathing) soft-edge width.
vec3 viewCol(vec2 uv, float w){
  float y = uv.y;

  // sky: vertical gradient (hazier at the horizon) + slow drifting cloud.
  vec2  sc    = 0.5 * vec2(cos(PH), sin(PH));           // circular -> loops
  float cloud = fbm(vec2(uv.x*2.6, y*2.6) + sc + 10.0);
  vec3  sky   = mix(vec3(0.60,0.71,0.75), vec3(0.37,0.52,0.64),
                    smoothstep(0.50, 0.86, y));
  sky = mix(sky, sky*1.07 + 0.02, cloud*0.55);
  sky *= 1.0 + 0.045*flick(1.0);

  // ocean line (thin, dark, desaturated blue).
  vec3 ocean = vec3(0.19, 0.32, 0.40) * (1.0 + 0.050*flick(2.0));

  // grass: blade fbm + darker bush clumps, gentle wind pan (loops via sin(PH)).
  vec2  gc    = vec2(sin(PH*2.0)*0.25, cos(PH*1.5)*0.15);
  float blade = fbm(vec2(uv.x*7.0, y*11.0) + gc + 3.0);
  float bush  = fbm(vec2(uv.x*3.5 + sin(PH)*0.20, y*3.5) + 21.0);
  vec3  grass = mix(vec3(0.40,0.52,0.28), vec3(0.29,0.43,0.22), blade);
  grass = mix(grass, vec3(0.19,0.29,0.16), smoothstep(0.55, 0.82, bush));
  grass *= 1.0 + 0.050*flick(3.0);

  // pale concrete sill in front of the lawn.
  vec3 sill = vec3(0.62, 0.64, 0.60) * (1.0 + 0.040*flick(4.0));

  // stack bottom -> top with soft, focus-breathing edges.
  vec3 v = sill;
  v = mix(v, grass, smoothstep(0.250-w, 0.250+w, y));
  v = mix(v, ocean, smoothstep(0.485-w, 0.485+w, y));
  v = mix(v, sky,   smoothstep(0.515-w, 0.515+w, y));

  // halation: a hot warm-white pool on the horizon, breathing with the bass.
  float glow = exp(-pow((y - 0.508)/0.028, 2.0));
  v += vec3(0.92,0.90,0.84) * glow * (0.30 + 0.35*BASS) * (0.80 + 0.35*flick(5.0));
  return v;
}

// dark plant silhouette in the corner: a vase mass + a few swaying branches.
float plantMask(vec2 uv){
  vec2  vp   = (uv - vec2(0.885, 0.10)) / vec2(0.085, 0.085);
  float vase = smoothstep(1.02, 0.86, length(vp));
  float br = 0.0;
  for(int i = 0; i < 4; i++){
    float fi   = float(i);
    float x0   = 0.905 - fi*0.006;
    float lean = (fi - 1.5) * 0.045;
    float t    = clamp((uv.y - 0.16)/0.52, 0.0, 1.0);
    float x    = x0 + lean*t + 0.012*sin(PH + fi*1.7 + t*3.0)*t;   // gentle sway
    float d    = abs(uv.x - x);
    br = max(br, step(0.16, uv.y) * smoothstep(0.0045, 0.0, d)
                                  * smoothstep(1.0, 0.78, t));      // taper at top
  }
  return clamp(vase + br, 0.0, 1.0);
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;
  PH   = TAU * u_time / LOOP;
  BASS = u_bass;

  // focus drift (Moonvoid): every soft edge widens and re-sharpens over the loop.
  float w = 0.006 + 0.010 * (0.5 + 0.5*sin(PH));

  // aperture geometry (the doorway opening).
  float apXL = 0.245, apXR = 0.755, floorY = 0.165, beamY = 0.860;
  float apX = smoothstep(apXL-w, apXL+w, uv.x) * smoothstep(apXR+w, apXR-w, uv.x);
  float apY = smoothstep(floorY-w, floorY+w, uv.y) * smoothstep(beamY+w, beamY-w, uv.y);
  float ap  = apX * apY;

  // frame: side walls everywhere, then floor over the bottom, beam over the top.
  vec3 col  = wallCol(uv, uv.x < 0.5 ? 1.0 : 0.0);
  vec3 beam = vec3(0.135, 0.152, 0.150) * (0.90 + 0.15*fbm(uv*3.0 + 2.0));
  beam *= 1.0 + 0.045*flick(41.0);
  col = mix(col, floorCol(uv), smoothstep(floorY+w, floorY-w, uv.y));
  col = mix(col, beam,          smoothstep(beamY-w,  beamY+w,  uv.y));

  // the view fills the aperture.
  col = mix(col, viewCol(uv, w), ap);

  // dark plant over the corner (near-black, faintly cool).
  float pm = plantMask(uv);
  col = mix(col, IL_BLACK*1.4 + vec3(0.0, 0.005, 0.010), pm);

  // --- whole-frame flicker family (never metronomic) ---
  // irregular exposure flutter + a rare warm light-leak sweeping the aperture.
  float ef = sin(PH*7.0 + 1.3) + 0.7*sin(PH*11.0 + 2.1) + 0.5*sin(PH*17.0);
  col *= 1.0 + 0.030*ef + 0.080*BASS;
  float sweepX  = 0.5 + 0.42*sin(PH*2.0);
  float leak    = exp(-pow((uv.x - sweepX)/0.16, 2.0));
  float leakAmt = smoothstep(0.60, 1.0, sin(PH*3.0 + 0.7));
  col += IL_WARMWHITE * leak * leakAmt * 0.060 * (0.70 + 0.70*BASS) * ap;

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, BASS), 1.0);
}
</script>

<script src="../../lib/visual-core.js"></script>

    title: 'DOORWAY SEA',
    subtitle: 'ambient techno · 07 · 4:3 · 30s loop<br>點擊進入全螢幕 — 允許麥克風以隨低音起伏<br><span style="opacity:.6">(無訊號時預設 115&nbsp;BPM · 色塊每 30 秒循環閃動)</span>',
    bpm: 115
  });
</script>
