<title>NN · New Track — Imaginary Lands</title>

<body>

<!-- ========================================================================
  STARTER SCENE — copy this folder to tracks/NN-<song>/ and rewrite the shader.

  You have (from the engine prelude, see CLAUDE.md):
    uniforms : u_res, u_time, u_bass (0..1), u_flow (drift), u_beat
    helpers  : hash(), vnoise(), fbm()
    palette  : IL_BLACK IL_GRAPHITE IL_BLUE IL_VIOLET IL_WARMWHITE
               IL_ICE IL_ACID IL_EMBER  (accents — use sparingly)
    post     : ambientPost(col, gl_FragCoord.xy, u_bass)  <- always end with this

  House rules: texture over time. Slow low-frequency change. No beat-locked
  strobing. Big soft forms, not high-frequency crinkle. Keep saturation low.
======================================================================== -->
<script id="scene" type="x-shader/x-fragment">
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
  float bass = u_bass;

  // slow drifting fog field — a calm, on-brand default to build from
  vec2 p = uv * 1.4;
  vec2 q = vec2(fbm(p + vec2(0.0, u_flow)),
                fbm(p + vec2(4.3, 1.7) - u_flow*0.6));
  float d = fbm(p + (1.2 + bass) * q);              // density, breathing with the bass

  // grade across the palette: near-black -> desaturated blue -> warm white haze
  vec3 col = mix(IL_BLACK, IL_BLUE, smoothstep(0.25, 0.75, d));
  col = mix(col, IL_WARMWHITE, smoothstep(0.72, 1.0, d) * 0.55);
  col += IL_VIOLET * 0.10 * smoothstep(0.4, 0.0, d); // violet sinking into the dark

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>

<script src="../../lib/visual-core.js"></script>
<script>
  Ambient.start({
    title: 'NEW TRACK',
    subtitle: 'ambient techno · NN · 4:3<br>點擊進入全螢幕 — 允許麥克風以隨低音起伏',
    bpm: 115          // set per song
  });
</script>
</body>
