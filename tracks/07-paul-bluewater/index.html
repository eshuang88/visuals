<!-- Scene: IL_paulBlueWater — FOOTAGE track (the project's footage half).
     Source: IL_paulBlueWater — a thin sheet of water washing a pale stone floor,
     sky reflected blue on one side, a glassy rippled boundary drifting across the
     frame, a dark reflective pool on the other. Floating Points (surface tension,
     reflection, emergence) crossed with Moonvoid (threshold / wet atmosphere).

     The real clip plays as the base (assets/paul-bluewater.{webm,mp4}, a seamless
     ~7.9s crossfade loop, the water slightly slowed for a calmer drift), treated in
     the house style and pushed further:

       · flow-warp  — the footage UV is domain-warped by u_flow (+ u_bass), so the
                      reflection liquefies a touch beyond its own motion; the warp
                      swells on the bass. Emotion sync, not beat sync.
       · framing    — texCoverUV() fits the ~1.38:1 clip into 4:3; a slow drift pans
                      the crop so no two passes of the loop frame identically.
       · grade      — the source is bright / high-key, so unlike the dark-sand track
                      it is pulled DOWN into the near-black house mood: the blue
                      reflection becomes the cold body (IL_BLUE / IL_ICE), the pale
                      floor a darkened warm-white, the pool near-black. Low-sat.
       · sheen      — a faint ice->violet iridescence rides only the glassy boundary
                      (a soap-film breath on the wet edge), kept sparing and low-sat
                      so it never reads as rainbow.
       · then       — ambientPost (bass swell, S-grade, vignette, film grain) so it
                      wears the same skin as every track.

     "Further seconds" (past ~8s / a 30s+ loop for the player): the clip is a
     seamless loop and u_flow never wraps, while the drift, warp phase, sheen and a
     slow tint breath keep evolving on cycles of minutes — so it stays alive
     indefinitely without ever reading as a cut or a hard repeat. Audio-reactive
     (mic bass, 115 BPM fallback). -->
<script id="scene" type="x-shader/x-fragment">
#define TAU 6.28318530718

// iterative domain warp -> the slow liquid "flow warp" laid over the footage.
vec2 flowWarp(vec2 p, float flow, float bass){
  vec2 q = vec2(fbm(p*1.2           + vec2(0.0, -flow)),
                fbm(p*1.2 + vec2(5.2,1.3) - vec2(0.0, flow*0.8)));
  vec2 r = vec2(fbm(p*1.6 + 1.7*q + vec2(1.7,9.2)),
                fbm(p*1.6 + 1.7*q + vec2(8.3,2.8)));
  return (r - 0.5) * (0.5 + bass);            // displacement, breathing with the bass
}

void main(){
  vec2 uv01 = gl_FragCoord.xy / u_res;        // 0..1 stage space
  float bass = u_bass;
  float flow = u_flow;
  float t    = u_time;

  // slow, seamless breaths (smooth oscillation -> no loop seam)
  float slow  = 0.5 + 0.5*sin(t*0.038);         // ~165 s
  float slow2 = 0.5 + 0.5*sin(t*0.024 + 1.7);   // ~260 s, out of phase

  // --- flow-warp the sampling coordinate (aspect-corrected so it's not squashed) ---
  vec2 asp = vec2(u_res.x/u_res.y, 1.0);
  vec2 wcoord = (uv01 - 0.5) * asp;
  vec2 disp = flowWarp(wcoord*1.5, flow, bass) * (0.009 + 0.012*bass);
  vec2 uvw = uv01 + disp / asp;

  // --- slow drift of the 4:3 crop; a slight zoom crops the footage's edges ---
  vec2 drift = vec2(0.013*sin(t*0.019) + 0.008*(slow-0.5),
                    0.010*cos(t*0.015) + 0.006*(slow2-0.5));
  vec2 uvf = (texCoverUV(uvw) - 0.5) / 1.10 + 0.5 + drift;   // 1.10 zoom hides edge wedges

  vec2 uvc = clamp(uvf, 0.001, 0.999);
  vec3 src = texture2D(u_tex, uvc).rgb;
  float Lraw = dot(src, vec3(0.30, 0.59, 0.11));    // raw luma (for the edge finite-diff)

  // the clip is bright / high-key — pull it DOWN and deepen so it reads as a dark
  // reflection glimpsed in the room, not a lit photo. (Opposite of the sand track.)
  src = pow(src, vec3(1.42));                       // darken + deepen mids
  src = clamp((src - 0.5) * 1.16 + 0.36, 0.0, 1.0); // contrast, seat the black low

  float L = dot(src, vec3(0.30, 0.59, 0.11));       // luma
  // how "blue" the sample is (sky reflection) — used to steer the cold body
  float blue = clamp((src.b - 0.5*(src.r + src.g)) * 2.2, 0.0, 1.0);

  // grade = a wash toward the IL palette ramp (keep the footage texture). The pale
  // floor (mid luma, low chroma) is pulled toward graphite-green; the blue
  // reflection becomes the cold body (blue -> ice); highlights the warm white.
  vec3 ramp = IL_BLACK;
  ramp = mix(ramp, IL_GRAPHITE,  smoothstep(0.04, 0.34, L));
  ramp = mix(ramp, IL_BLUE,      smoothstep(0.22, 0.62, L) * (0.35 + 0.55*blue));
  ramp = mix(ramp, IL_ICE,       smoothstep(0.44, 0.74, L) * (0.16 + 0.40*blue));
  ramp = mix(ramp, IL_VIOLET,    smoothstep(0.34, 0.66, L) * 0.16);
  ramp = mix(ramp, IL_WARMWHITE, smoothstep(0.76, 0.99, L));
  vec3 col = mix(src, ramp, 0.58);                  // palette wash (house-colored)
  col = mix(vec3(L), col, 0.82);                    // pull saturation down (low-sat house)

  // glassy-boundary sheen: a faint soap-film iridescence that rides only the wet
  // rippled edge, breathing ice<->violet. Kept low amplitude + low-sat so it is a
  // sheen, never a rainbow. The edge is found with two neighbour taps (WebGL1 has
  // no screen-space derivatives) — a small finite difference of footage luma.
  vec2 texel = 2.0 / max(u_texRes, vec2(1.0));
  float Lr = dot(texture2D(u_tex, clamp(uvf + vec2(texel.x, 0.0), 0.001, 0.999)).rgb, vec3(0.30,0.59,0.11));
  float Lu = dot(texture2D(u_tex, clamp(uvf + vec2(0.0, texel.y), 0.001, 0.999)).rgb, vec3(0.30,0.59,0.11));
  float edge = clamp((abs(Lr - Lraw) + abs(Lu - Lraw)) * 9.0, 0.0, 1.0);
  float sheen = 0.5 + 0.5*sin(L*10.0 + flow*0.6 + wcoord.x*3.0 + 1.5*slow2);
  vec3 irid = mix(IL_ICE, IL_VIOLET, sheen);
  col += (irid - dot(irid, vec3(0.33))) * edge * (0.10 + 0.10*bass);

  // floor halation: warm-white bloom lifted off the bright pale sheet, pooled by a
  // slow weather field so where it gathers wanders across the frame.
  float weather = fbm(wcoord*0.9 + vec2(0.0, -flow*0.4) + 4.0);
  float crest = smoothstep(0.62, 0.95, L);
  col += IL_WARMWHITE * crest * crest * (0.10 + 0.12*weather) * (0.7 + 0.6*bass);

  // faint ice tint deepening the dark reflective pool (the cold shadow side)
  col += IL_ICE * 0.05 * smoothstep(0.28, 0.04, L) * (0.6 + 0.4*slow);

  // gentle non-metronomic exposure breath (a few percent)
  col *= 1.0 + 0.032*sin(t*0.66 + weather*4.0);

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>
