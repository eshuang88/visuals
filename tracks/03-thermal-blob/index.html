<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>03 · Thermal Blob — Imaginary Lands</title>
<link rel="stylesheet" href="../../lib/visual-core.css">
</head>
<body>

<!-- Scene: thermal fluid gold (STOOR direction). Four non-overlapping rectilinear
     tangram blocks hold soft morphing thermal fields — creamy-chrome silver panels
     and fire-on-black panels — with glowing chromatic contour rims. Gold-dominant,
     warming to white-hot; blue / red / green appear by heat.

     Uses the engine prelude (fbm, ambientPost) + standard uniforms. Motion is a
     seamless 30s loop: every time-dependence enters through the loop phase
     ph = TAU*u_time/30 (domain-warp offsets orbit on circles), so the field
     returns exactly to its start each pass. u_bass is a live overlay (heat swell,
     rim shimmer) that never breaks the loop. -->
<script id="scene" type="x-shader/x-fragment">
#define TAU  6.28318530718
#define LOOP 30.0

/* ---- rectilinear SDF helpers ---- */
float sdBox(vec2 p, vec2 c, vec2 h){ vec2 d=abs(p-c)-h; return length(max(d,0.0))+min(max(d.x,d.y),0.0); }
float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2){
  vec2 e0=p1-p0,e1=p2-p1,e2=p0-p2;
  vec2 v0=p-p0,v1=p-p1,v2=p-p2;
  vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
  vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
  vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);
  float s=sign(e0.x*e2.y-e0.y*e2.x);
  vec2 d=min(min(vec2(dot(pq0,pq0),s*(v0.x*e0.y-v0.y*e0.x)),
                 vec2(dot(pq1,pq1),s*(v1.x*e1.y-v1.y*e1.x))),
                 vec2(dot(pq2,pq2),s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y);
}

/* 4 non-overlapping tangram blocks (uv 0..1, y up) */
float blockSD(int id, vec2 p){
  if(id==0){ float a=sdBox(p,vec2(0.295,0.795),vec2(0.250,0.160));   // top-left + step
             float b=sdBox(p,vec2(0.140,0.517),vec2(0.095,0.117)); return min(a,b); }
  if(id==1) return sdBox(p,vec2(0.775,0.632),vec2(0.180,0.322));     // tall right
  if(id==2) return sdBox(p,vec2(0.415,0.500),vec2(0.130,0.100));     // centre
  return      sdBox(p,vec2(0.500,0.157),vec2(0.455,0.112));          // bottom bar
}
/* per-block chrome-ness: 0 = deep black field, 1 = creamy silver field */
float blockChrome(int id){
  if(id==0) return 0.90;
  if(id==1) return 0.05;
  if(id==2) return 0.70;
  return 0.02;
}

/* thermal ramp — black blocks read fire-on-black; chrome blocks stay silver
   through low/mid and only warm to gold/white at the hot core */
vec3 thermal(float h, float chrome){
  h=clamp(h,0.0,1.0);
  vec3 c0=mix(vec3(0.050,0.037,0.028), vec3(0.60,0.62,0.66), chrome);
  vec3 c1=mix(vec3(0.26,0.09,0.05),    vec3(0.70,0.72,0.76), chrome);
  vec3 c2=mix(vec3(0.82,0.26,0.07),    vec3(0.82,0.84,0.88), chrome);
  vec3 c3=mix(vec3(0.99,0.56,0.13),    vec3(0.94,0.93,0.94), chrome);
  vec3 c4=vec3(1.00,0.80,0.30);
  vec3 c5=vec3(1.00,0.93,0.63);
  vec3 c6=vec3(1.00,0.99,0.94);
  vec3 c;
  if(h<0.14)      c=mix(c0,c1,smoothstep(0.00,0.14,h));
  else if(h<0.34) c=mix(c1,c2,smoothstep(0.14,0.34,h));
  else if(h<0.52) c=mix(c2,c3,smoothstep(0.34,0.52,h));
  else if(h<0.68) c=mix(c3,c4,smoothstep(0.52,0.68,h));
  else if(h<0.84) c=mix(c4,c5,smoothstep(0.68,0.84,h));
  else            c=mix(c5,c6,smoothstep(0.84,1.00,h));
  return c;
}

/* smooth thermal field with looping domain-warp (seamless in ph) */
float fieldH(vec2 P, float ph){
  vec2 w = vec2(fbm(P + vec2(cos(ph),sin(ph))*0.50),
                fbm(P + vec2(cos(ph*0.83+2.1),sin(ph*0.83+2.1))*0.46 + 4.3));
  return fbm(P + 0.90*w);
}
/* contrast + cold bias: black blocks mostly deep black w/ a small hot patch,
   chrome blocks stay silver; bass heat-pump; fade to cold at the block edge */
float shapeH(float x, float con, float base, float bp, float fade){
  return mix(0.006, clamp((x-0.60)*con + base + bp, 0.0, 1.0), fade);
}

void main(){
  vec2 uv = gl_FragCoord.xy / u_res;     // 0..1, y up
  float aspect = u_res.x / u_res.y;
  float ph = TAU * u_time / LOOP;
  float aa = 1.5 / u_res.y;

  /* which of the 4 blocks owns this pixel */
  int bid=-1; float depth=0.0; float cover=0.0;
  for(int i=0;i<4;i++){
    float d=blockSD(i,uv);
    cover=max(cover, 1.0-smoothstep(0.0,aa,d));
    if(d<0.0){ bid=i; depth=-d; }
  }

  /* brown near-black between blocks */
  vec3 bg=vec3(0.050,0.038,0.029);
  bg*=0.72+0.28*fbm(uv*2.2+7.0);
  vec3 col=bg;

  if(bid>=0){
    float chrome=blockChrome(bid);
    float sk=float(bid);
    vec2 P=uv*vec2(aspect,1.0)*1.35 + vec2(sk*17.3, sk*11.9);

    float E=0.016;
    float h  = fieldH(P, ph);
    float hX = fieldH(P+vec2(E,0.0), ph);
    float hY = fieldH(P+vec2(0.0,E), ph);

    float fade=smoothstep(0.0,0.05,depth);
    float bp=u_bass*0.14;
    float base=mix(0.10,0.34,chrome);
    float con =mix(2.05,1.55,chrome);
    h=shapeH(h,con,base,bp,fade); hX=shapeH(hX,con,base,bp,fade); hY=shapeH(hY,con,base,bp,fade);

    vec2 grad=vec2(hX-h,hY-h)/E;
    float gh=length(grad);

    /* chromatic dispersion across soft edges => glowing thermal contour rim */
    float disp=(0.10+chrome*0.09)*smoothstep(0.0,1.1,gh);
    vec3 cR=thermal(h+disp, chrome);
    vec3 cB=thermal(h-disp, chrome);
    vec3 cG=thermal(h,       chrome);
    vec3 fluid=vec3(cR.r, cG.g, cB.b);

    /* cold-white flicker — non-metronomic, wanders with time, lifts on bass */
    float flick = clamp(0.35 + 0.65*fbm(vec2(u_time*1.6, 11.0)) + u_bass*0.4, 0.0, 1.0);

    float rimBoost=1.0+chrome*1.6;
    float edge=smoothstep(mix(0.30,0.16,chrome),1.15,gh);
    fluid += vec3(0.16,0.42,0.85)*edge*0.22*rimBoost*(0.6+0.4*flick); // cyan-blue halo
    fluid += vec3(1.00,0.52,0.14)*edge*0.15*rimBoost;                 // warm orange kiss
    fluid += vec3(0.30,1.00,0.55)*edge*edge*0.08*chrome;              // faint green band

    float hot=smoothstep(0.75,1.0,h);
    fluid = mix(fluid, mix(fluid, vec3(1.0,0.97,0.90), 0.35), hot*(1.0-edge));
    fluid += vec3(0.80,0.90,1.05)*hot*(1.0-edge)*0.14*flick;

    col = mix(bg, fluid, cover);

    /* etched triangle motif inside the tall-right block */
    if(bid==1){
      float dtri=abs(sdTri(uv, vec2(0.775,0.720), vec2(0.660,0.460), vec2(0.890,0.460)));
      float tl=1.0-smoothstep(0.0018,0.0018+aa,dtri);
      col=mix(col, vec3(0.80,0.88,1.02), tl*0.35);
    }
  }

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, u_bass), 1.0);
}
</script>

<script src="../../lib/visual-core.js"></script>
<script>
  Ambient.start({
    title: 'THERMAL BLOB',
    subtitle: 'ambient techno · 03 · 4:3 · 30s loop<br>點擊進入全螢幕 — 允許麥克風以隨低音起伏<br><span style="opacity:.6">(無訊號時預設 115&nbsp;BPM)</span>',
    bpm: 115
  });
</script>
</body>
