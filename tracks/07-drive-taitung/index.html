<!-- Scene: IL_driveTaitung — FOOTAGE track (consumer-signal / retro diary half).
     Source: IL_driveTaitung — a hand-held / dash driving clip from Taitung. The
     real loop plays as a GL texture, treated in the house style toward a retro,
     grainy, VHS/DV feel — "一直在開車" (endlessly driving):

       · chroma      — lens chromatic aberration that widens toward the frame
                       edges AND swells on the bass ("accelerate" = colours split
                       further), plus a horizontal VHS chroma smear. This is the
                       "chroma 濾鏡".
       · retro       — a rolling scanline comb, a slow head-switch luma bar
                       drifting up the frame, a dropout speckle band at the very
                       bottom, tape jitter + engine-idle micro-shake, and extra
                       tape grain over ambientPost's film grain.
       · framing     — texCoverUV() fits the clip into 4:3; a slow drift pans the
                       crop so no two passes of the loop frame identically.
       · grade       — cold graphite body with warm-white headlight halation, then
                       ambientPost (bass swell, S-grade, vignette, film grain) so
                       it wears the same skin as every track.

     Reference direction: Mac DeMarco — consumer-signal texture (VHS / DV) diary.
     Palette stays canonical IL_*, low-saturation, with a deliberate whisper of
     IL_EMBER in the mids for nostalgic diary warmth (noted per CLAUDE.md).

     Loop: the source clip is ~14.7 s, so the seamless footage loop is ~14 s; but
     u_flow / travel / drift / grade all evolve as slow functions that never wrap,
     and the crop-drift reframes every pass, so it reads as continuous driving
     well past 30 s — never a cut and never a hard repeat. Audio-reactive (mic
     bass, 115 BPM fallback). -->
<script id="scene" type="x-shader/x-fragment">
#define TAU 6.28318530718

// per-scanline hash -> tape jitter / tracking wobble
float lineNoise(float y, float t){
  return hash(vec2(floor(y*230.0), floor(t*11.0)));
}

void main(){
  vec2 uv01 = gl_FragCoord.xy / u_res;        // 0..1 stage space
  float bass = u_bass;
  float flow = u_flow;
  float t    = u_time;

  // slow, seamless breaths (smooth oscillation -> no loop seam)
  float slow  = 0.5 + 0.5*sin(t*0.045);
  float slow2 = 0.5 + 0.5*sin(t*0.028 + 1.7);

  // a continuous "travel" phase for the scan / bar roll — never wraps (seamless)
  float travel = flow*0.15 + t*0.02;

  // --- 4:3 cover-fit + slow drifting crop (no two passes frame alike) ---
  vec2 drift = vec2(0.010*sin(t*0.019) + 0.006*(slow-0.5),
                    0.008*cos(t*0.015) + 0.005*(slow2-0.5));
  vec2 uvf = (texCoverUV(uv01) - 0.5) / 1.10 + 0.5 + drift;   // 1.10 zoom hides edges

  // --- road vibration: per-line tracking wobble + engine-idle micro-shake ---
  float track  = lineNoise(uv01.y, t) - 0.5;
  float wobble = smoothstep(0.72, 1.0, 0.5 + 0.5*sin(t*0.23));  // rare wobble windows
  uvf.x += track * (0.0016 + 0.011*wobble) * (0.6 + bass);
  uvf.y += 0.0008*sin(t*7.0 + uv01.x*3.0);

  // --- chroma filter: lens chromatic aberration, widening toward the edges and
  //     swelling with the bass; combined with a horizontal VHS chroma smear ---
  vec2 fromC = uv01 - 0.5;
  float edge = dot(fromC, fromC);                       // 0 center -> ~0.4 corner
  float ca   = (0.0016 + 0.006*edge) * (0.8 + 0.9*bass);
  vec2 uvr = uvf + vec2(ca + 0.004*edge, 0.0);
  vec2 uvb = uvf - vec2(ca + 0.004*edge, 0.0);
  vec3 src;
  src.r = texture2D(u_tex, clamp(uvr, 0.001, 0.999)).r;
  src.g = texture2D(u_tex, clamp(uvf, 0.001, 0.999)).g;
  src.b = texture2D(u_tex, clamp(uvb, 0.001, 0.999)).b;

  // the dashcam clip is bright / high-key (blown sky). Pull it DOWN into the
  // house near-black base: deepen the mids, then roll the blown sky down to a
  // luminous grey so the frame reads moody (and the palette wash maps it to cool
  // blue, not white). ambientPost's S-grade then finishes the crush.
  src = pow(clamp(src, 0.0, 1.0), vec3(1.38));
  float hiL = smoothstep(0.44, 1.0, dot(src, vec3(0.30, 0.59, 0.11)));
  src *= 1.0 - 0.55*hiL;                                // tame the white-out sky (open-sun stretches)

  float L = dot(src, vec3(0.30, 0.59, 0.11));

  // --- house grade: a wash toward the IL palette ramp (keep footage texture) ---
  vec3 ramp = IL_BLACK;
  ramp = mix(ramp, IL_GRAPHITE,  smoothstep(0.05, 0.32, L));
  ramp = mix(ramp, IL_BLUE,      smoothstep(0.28, 0.60, L) * 0.55);
  ramp = mix(ramp, IL_VIOLET,    smoothstep(0.32, 0.62, L) * 0.20);
  ramp = mix(ramp, IL_WARMWHITE, smoothstep(0.66, 0.98, L));
  vec3 col = mix(src, ramp, 0.40);                       // palette wash
  col = mix(vec3(L), col, 0.78);                         // pull saturation down

  // retro cast: cool ice in the shadows, a whisper of ember in the mids
  // (deliberate per-track warmth for the diary feel; kept tiny + low-sat).
  col += IL_ICE   * 0.05 * smoothstep(0.32, 0.05, L) * (0.6 + 0.4*slow2);
  col += IL_EMBER * 0.05 * smoothstep(0.30, 0.62, L) * (1.0 - smoothstep(0.62, 0.90, L));

  // sky / horizon halation: a controlled warm glow lifted off the brightest bits
  // (the high-key sky is already bright, so this stays gentle + gated high),
  // pooled by a slow field so where it gathers wanders as you drive.
  float weather = fbm(fromC*2.0 + vec2(0.0, -travel) + 5.0);
  float crest = smoothstep(0.74, 0.98, L);
  col += IL_WARMWHITE * crest * (0.06 + 0.08*weather) * (0.7 + 0.5*bass);

  // --- rolling scanline comb (subtle; drifts downward with travel) ---
  float scan = 0.5 + 0.5*sin(uv01.y*640.0 - travel*40.0);
  col *= 1.0 - 0.06*scan;

  // slow head-switch luma bar drifting up the frame
  float bar = fract(uv01.y*0.9 - travel*0.6);
  col *= 1.0 + 0.05 * smoothstep(0.0, 0.08, bar) * smoothstep(0.16, 0.08, bar);

  // VHS dropout speckle band along the very bottom edge
  float band = smoothstep(0.055, 0.0, uv01.y);
  float sp   = step(0.72, hash(vec2(floor(uv01.x*320.0), floor(t*30.0))));
  col = mix(col, mix(col, vec3(L*1.4), 0.5), band*sp);

  // extra tape grain over ambientPost's film grain
  float g = hash(gl_FragCoord.xy + floor(t*24.0));
  col += (g - 0.5) * 0.045;

  // gentle non-metronomic exposure breath
  col *= 1.0 + 0.035*sin(t*0.66 + weather*4.0);

  // scene vignette: frame the bright road-centre and sink the corners toward
  // near-black (the house look; ambientPost's own vignette is deliberately mild).
  // The centre breathes a touch with the bass, like leaning into the drive.
  float vg = smoothstep(1.12, 0.28, length((uv01 - 0.5) * vec2(1.10, 1.30)));
  col *= (0.34 + 0.66*vg) * (1.0 + 0.05*bass);
  col *= 0.94;                                          // overall pull into the mood

  gl_FragColor = vec4(ambientPost(col, gl_FragCoord.xy, bass), 1.0);
}
</script>
